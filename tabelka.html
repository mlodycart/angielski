<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angielski - Tabela Słówek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scrollbar-gutter: stable; overflow-y: scroll; }
        body { background-color: #0b0d0f; color: #fff; font-family: 'Space Grotesk', sans-serif; font-weight: 500; display: flex; flex-direction: column; align-items: center; min-height: 100vh; position: relative; overflow-x: hidden; width: 100%; max-width: 100vw; }
        
        body::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none; z-index: 0;
        }
        .glow {
            position: absolute; top: 15%; left: 50%; transform: translate(-50%, -50%); width: 100%; max-width: 700px; height: 350px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.08) 0%, rgba(76, 175, 80, 0.05) 50%, transparent 80%);
            filter: blur(80px); pointer-events: none; z-index: 0;
        }

        header { position: relative; z-index: 1001; width: 100%; display: flex; justify-content: center; padding: 20px 15px; }
        .nav-capsule {
            background: rgba(18, 22, 26, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px; border-radius: 999px; display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1350px;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: #fff; text-decoration: none; }
        .brand-icon { width: 10px; height: 10px; background: #00e5ff; border-radius: 50%; box-shadow: 0 0 10px #00e5ff; }
        .nav-links { display: flex; gap: 18px; list-style: none; }
        .nav-links a { color: #9aa0a6; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: #00e5ff; }
        .nav-btn {
            background: rgba(0, 229, 255, 0.1); color: #00e5ff; border: 1px solid rgba(0, 229, 255, 0.3);
            padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; text-decoration: none; transition: all 0.2s;
        }
        .nav-btn:hover { background: #00e5ff; color: #0b0d0f; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }

        .tab-content { position: relative; z-index: 10; display: block; width: 100%; max-width: 1350px; padding: 10px 10px 60px 10px; }
        
        .table-header-bar { 
            position: sticky; top: 15px; z-index: 1000; display: flex; justify-content: flex-end; align-items: center; 
            margin-bottom: 15px; background: rgba(18, 22, 26, 0.9); backdrop-filter: blur(12px); padding: 12px 15px; 
            border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        
        .search-box { position: relative; display: flex; align-items: center; width: 100%; height: 42px; }
        .search-input { width: 100%; height: 42px; padding: 0 38px 0 12px; font-family: inherit; font-size: 14px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; background: rgba(255, 255, 255, 0.05); color: white; outline: none; }
        .search-input:focus { border-color: #00e5ff; }
        
        .clear-search-btn {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #00e5ff; cursor: pointer; display: none; align-items: center; justify-content: center; padding: 4px; font-size: 18px; font-weight: 700;
        }
        
        .table-responsive { 
            width: 100%; 
            border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            background: rgba(18, 22, 26, 0.8); 
            backdrop-filter: blur(12px);
            overflow: hidden;
        }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
        th, td { padding: 10px 10px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.06); word-wrap: break-word; overflow-wrap: break-word; }
        th { background: rgba(0, 0, 0, 0.4); font-weight: 700; font-size: 14px; border-bottom: 2px solid rgba(255, 255, 255, 0.1); color: #00e5ff; letter-spacing: 0.5px; }
        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) { background: rgba(255, 255, 255, 0.015); }
        tr:hover td { background: rgba(255, 255, 255, 0.03); }
        tr.highlighted-row { background: rgba(0, 229, 255, 0.15) !important; color: #fff !important; font-weight: bold; }
        tr.highlighted-row td { color: #fff !important; }
        tr.highlighted-row strong { color: #00e5ff !important; }

        .sub-desc {
            color: #00e5ff !important;
            font-weight: 500;
            font-size: 0.95em;
        }

        @media(max-width: 900px) { 
            .nav-links { display: none; } 
            th, td { padding: 8px 8px; font-size: 12px; }
            th { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <header>
        <nav class="nav-capsule">
            <a href="index.html" class="brand"><span class="brand-icon"></span>English Vocabulary</a>
            <ul class="nav-links">
                <li><a href="index.html">Strona główna</a></li>
                <li><a href="quiz_wpisywany.html">Quiz Wpisz</a></li>
                <li><a href="quiz_abcd.html">Quiz ABCD</a></li>
            </ul>
            <a href="tabelka.html" class="nav-btn">Baza Wiedzy</a>
        </nav>
    </header>

    <div class="tab-content">
        <div class="table-header-bar">
            <form class="search-box" action="javascript:void(0);" onsubmit="searchTable(); return false;">
                <input type="text" id="table-search-input" class="search-input" placeholder="Szukaj..." autocomplete="off" oninput="toggleClearButton()">
                <button type="button" id="clear-search-btn" class="clear-search-btn" onclick="clearSearch()" title="Wyczyść">&#10005;</button>
            </form>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 38%;">Słówko</th>
                        <th style="width: 62%;">Tłumaczenie</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script src="historyData.js"></script>
    <script>
        function buildTable() {
            document.getElementById('table-body').innerHTML = historyData.map((w, idx) => {
                let mainText = w.title;
                let bracketText = "";
                const bracketIdx = w.title.indexOf('(');
                if (bracketIdx !== -1) {
                    mainText = w.title.substring(0, bracketIdx).trim();
                    bracketText = w.title.substring(bracketIdx);
                }

                return `
                    <tr id="row-word-${idx}">
                        <td><strong>${mainText}</strong> ${bracketText ? `<span class="sub-desc">${bracketText}</span>` : ''}</td>
                        <td>${w.desc}</td>
                    </tr>
                `;
            }).join('');
        }

        function toggleClearButton() {
            const input = document.getElementById("table-search-input");
            const clearBtn = document.getElementById("clear-search-btn");
            clearBtn.style.display = input.value.length > 0 ? "flex" : "none";
        }

        function clearSearch() {
            const input = document.getElementById("table-search-input");
            input.value = "";
            toggleClearButton();
            document.querySelectorAll("#table-body tr").forEach(tr => tr.classList.remove("highlighted-row"));
            input.focus();
        }

        function searchTable() {
            const queryRaw = document.getElementById("table-search-input").value.trim().toLowerCase();
            document.querySelectorAll("#table-body tr").forEach(tr => tr.classList.remove("highlighted-row"));
            if (!queryRaw) return;

            const queryWords = queryRaw.split(/\s+/).filter(w => w.length > 0);
            let matchingIndexes = [];
            
            historyData.forEach((w, idx) => {
                const combinedText = [w.title, w.desc, ...(w.titleKeywords || []), ...(w.descKeywords || [])].join(" ").toLowerCase();
                if (combinedText.includes(queryRaw) || queryWords.every(qw => combinedText.includes(qw))) {
                    matchingIndexes.push(idx);
                }
            });

            if (matchingIndexes.length >= 1) {
                const row = document.getElementById(`row-word-${matchingIndexes[0]}`);
                if (row) {
                    row.classList.add("highlighted-row");
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
            document.getElementById("table-search-input").blur();
        }

        window.onload = function() {
            buildTable();
        };
    </script>
</body>
</html>
