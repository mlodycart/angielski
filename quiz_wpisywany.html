<!DOCTYPE html>
<html lang="pl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Angielski - Quiz: Wpisz angielskie słówko</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0d0f; color: #fff; font-family: 'Space Grotesk', sans-serif; font-weight: 500; display: flex; flex-direction: column; align-items: center; min-height: 100vh; position: relative; overflow-x: hidden; max-width: 100vw; }
        
        body::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none; z-index: 0;
        }
        .glow {
            position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%); width: 100%; max-width: 600px; height: 300px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.08) 0%, rgba(76, 175, 80, 0.05) 50%, transparent 80%);
            filter: blur(80px); pointer-events: none; z-index: 0;
        }

        header { position: relative; z-index: 10; width: 100%; display: flex; justify-content: center; padding: 20px 15px; }
        .nav-capsule {
            background: rgba(18, 22, 26, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px; border-radius: 999px; display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 950px;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: #fff; text-decoration: none; }
        .brand-icon { width: 10px; height: 10px; background: #00e5ff; border-radius: 50%; box-shadow: 0 0 10px #00e5ff; }
        .nav-links { display: flex; gap: 18px; list-style: none; }
        .nav-links a { color: #9aa0a6; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: #00e5ff; }
        .nav-btn {
            background: rgba(0, 229, 255, 0.1); color: #00e5ff; border: 1px solid rgba(0, 229, 255, 0.3);
            padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; text-decoration: none; transition: all 0.2s;
        }
        .nav-btn:hover { background: #00e5ff; color: #0b0d0f; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }

        .tab-content { position: relative; z-index: 10; display: block; width: 100%; max-width: 900px; padding: 10px 15px 60px 15px; }
        .quiz-container { background: rgba(18, 22, 26, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); text-align: center; margin: 10px auto; position: relative; backdrop-filter: blur(12px); }
        
        .quiz-reset-btn { position: absolute; top: 15px; right: 15px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; cursor: pointer; text-decoration: none; transition: all 0.2s; }
        .quiz-reset-btn:hover { background: rgba(0, 229, 255, 0.1); border-color: #00e5ff; color: #00e5ff; }

        h1 { color: #fff; margin-top: 0; font-size: 26px; font-weight: 700; margin-bottom: 16px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px; text-align: center; }
        .stat-card-title { font-size: 11px; font-weight: 700; color: #9aa0a6; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; }
        .stat-card-value { font-size: 20px; font-weight: 700; color: #00e5ff; }

        .translation-box { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 20px; border-radius: 14px; margin-bottom: 20px; }
        .translation-label { font-size: 13px; color: #9aa0a6; margin-bottom: 6px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        .translation-value { font-size: 24px; font-weight: 700; color: #00e5ff; word-break: break-word; }
        
        .input-group { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 16px; border-radius: 12px; margin-bottom: 20px; text-align: left; }
        .input-label { font-size: 12px; color: #9aa0a6; margin-bottom: 8px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        input[type="text"] { width: 100%; padding: 14px 14px; font-family: inherit; font-weight: 600; font-size: 16px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; background: rgba(255, 255, 255, 0.05); color: white; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #00e5ff; }
        input:disabled { background: rgba(255, 255, 255, 0.02); color: #888; opacity: 1; }
        
        .action-buttons-wrapper { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; width: 100%; }
        .btn-action { background: rgba(0, 229, 255, 0.12); color: #00e5ff; border: 1px solid rgba(0, 229, 255, 0.4); padding: 14px 24px; font-family: inherit; font-weight: 700; font-size: 16px; border-radius: 12px; cursor: pointer; transition: all 0.3s; width: 100%; max-width: 260px; }
        .btn-action:hover { background: #00e5ff; color: #0b0d0f; box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); }
        
        .btn-next { background: rgba(33, 150, 243, 0.15) !important; color: #2196F3 !important; border-color: rgba(33, 150, 243, 0.4) !important; }
        .btn-next:hover { background: #2196F3 !important; color: #fff !important; box-shadow: 0 0 20px rgba(33, 150, 243, 0.4) !important; }
        
        .btn-skip { background: rgba(255, 255, 255, 0.05) !important; color: #aaa !important; border-color: rgba(255, 255, 255, 0.15) !important; }
        .btn-skip:hover { background: rgba(255, 255, 255, 0.15) !important; color: #fff !important; box-shadow: 0 0 20px rgba(255, 255, 255, 0.2) !important; }
        
        .btn-end { background: rgba(229, 57, 53, 0.15) !important; color: #e53935 !important; border-color: rgba(229, 57, 53, 0.4) !important; }
        .btn-end:hover { background: #e53935 !important; color: #fff !important; box-shadow: 0 0 20px rgba(229, 57, 53, 0.4) !important; }
        
        .btn-retry-wrong { background: rgba(255, 152, 0, 0.15) !important; color: #ff9800 !important; border-color: rgba(255, 152, 0, 0.4) !important; }
        .btn-retry-wrong:hover { background: #ff9800 !important; color: #fff !important; box-shadow: 0 0 20px rgba(255, 152, 0, 0.4) !important; }

        .feedback { margin-top: 20px; font-size: 18px; font-weight: 600; min-height: 35px; line-height: 1.4; }
        .correct { color: #4CAF50; }
        .incorrect { color: #f44336; }
        .skipped-text { color: #9aa0a6; }
        .counter { font-size: 14px; color: #9aa0a6; margin-bottom: 12px; font-weight: 600; }

        .summary-container { text-align: left; margin-top: 15px; }
        .summary-title { font-size: 20px; color: #fff; font-weight: 700; text-align: center; margin-bottom: 15px; }
        .summary-score { font-size: 18px; text-align: center; margin-bottom: 25px; color: #00e5ff; font-weight: 700; }
        .summary-list { background: rgba(255, 255, 255, 0.02); border-radius: 12px; padding: 12px; border: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; gap: 10px; max-height: 350px; overflow-y: auto; }
        .summary-item { background: rgba(255, 255, 255, 0.04); border-radius: 10px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #555; gap: 10px; flex-wrap: wrap; }
        .summary-item.perfect { border-left-color: #4CAF50; }
        .summary-item.failed { border-left-color: #f44336; }
        .summary-item.skipped { border-left-color: #888; background: rgba(255,255,255,0.02); }
        .summary-item-content { flex-grow: 1; font-size: 15px; line-height: 1.4; }
        .summary-num { font-weight: bold; color: #888; margin-right: 6px; }
        .summary-word { font-weight: bold; font-size: 16px; color: #fff; }
        .summary-score-badge { font-size: 15px; font-weight: 700; padding: 5px 12px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        .summary-details { font-size: 13px; margin-top: 5px; color: #aaa; }
        .text-correct { color: #4CAF50; font-weight: bold; }
        .text-skipped { color: #888; }
        .summary-footer-bar { margin-top: 20px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

        @media(max-width: 900px) { .nav-links { display: none; } }
    </style>
</head>
<body>

    <div class="glow"></div>

    <header>
        <nav class="nav-capsule">
            <a href="index.html" class="brand"><span class="brand-icon"></span>English Vocabulary</a>
            <ul class="nav-links">
                <li><a href="index.html">Strona główna</a></li>
                <li><a href="quiz_wpisywany.html" class="active">Quiz Wpisz</a></li>
                <li><a href="quiz_abcd.html">Quiz ABCD</a></li>
            </ul>
            <a href="tabelka.html" class="nav-btn">Baza Wiedzy</a>
        </nav>
    </header>

    <div class="tab-content">
        <div class="quiz-container" id="in-quiz-box">
            <a href="#" class="quiz-reset-btn" onclick="restartInputQuiz(); return false;" title="Resetuj quiz">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
            </a>
            <h1>Quiz: Wpisz angielskie słówko</h1>
            
            <div class="stats-grid">
                <div class="stat-card" id="in-last-card">
                    <div class="stat-card-title">Ostatnie pytanie</div>
                    <div class="stat-card-value" id="in-last-score-text">0%</div>
                </div>
                <div class="stat-card" id="in-avg-card">
                    <div class="stat-card-title">Średnia celność</div>
                    <div class="stat-card-value" id="in-avg-score-text">0%</div>
                </div>
            </div>

            <div class="counter" id="in-progress-text"></div>
            
            <div class="translation-box">
                <div class="translation-label">Znaczenie po polsku:</div>
                <div class="translation-value" id="in-val-translation">-</div>
            </div>

            <div class="input-group">
                <div class="input-label">Wpisz po angielsku...</div>
                <input type="text" id="input-answer" placeholder="Wpisz po angielsku..." autocomplete="off">
            </div>

            <div class="action-buttons-wrapper">
                <button class="btn-action" id="in-check-btn" onclick="handleInputStep()">Sprawdź</button>
                <button class="btn-action btn-next" id="in-next-btn" onclick="loadNextInputQuestion()" style="display: none;">Następne pytanie</button>
                <button class="btn-action btn-skip" id="in-skip-btn" onclick="skipInputQuestion()">Pomiń pytanie</button>
                <button class="btn-action btn-end" id="in-end-btn" onclick="showInputSummary()">Zakończ quiz</button>
            </div>

            <div class="feedback" id="in-feedback"></div>
        </div>
    </div>

    <script src="historyData.js"></script>
    <script>
        function normalizeStr(str) {
            return str.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").replace(/\s+/g, " ");
        }

        function evaluateAnswer(userStr, targetTitle) {
            const cleanUser = normalizeStr(userStr);
            const cleanTarget = normalizeStr(targetTitle);

            if (!cleanUser) return { percentage: 0, matched: [], missing: [targetTitle] };
            
            // Ścisłe porównanie
            if (cleanUser === cleanTarget) {
                return { percentage: 100, matched: [targetTitle], missing: [] };
            }

            // Pozwalamy na brak 'sb', 'sth' lub słów w nawiasach jeśli użytkownik wpisał resztę poprawnie
            const cleanTargetOptional = normalizeStr(targetTitle.replace(/\b(sb|sth)\b/gi, "").replace(/\(.*?\)/g, ""));
            if (cleanUser === cleanTargetOptional && cleanUser.length > 0) {
                return { percentage: 100, matched: [targetTitle], missing: [] };
            }

            return { percentage: 0, matched: [], missing: [targetTitle] };
        }

        function getScoreColor(percent) {
            if (percent < 50) return '#f44336';
            return '#4CAF50';
        }

        function applyStatCardColor(cardId, valueId, scorePercent) {
            const cardEl = document.getElementById(cardId);
            const valueEl = document.getElementById(valueId);
            if (!cardEl || !valueEl) return;
            const color = getScoreColor(scorePercent);
            valueEl.style.color = color;
            valueEl.innerText = `${scorePercent}%`;
        }

        let inTotalPool = [...historyData];
        let inAvailableWords = [], inCurrentWord = {}, inScoreTotal = 0, inQuestionNumber = 0;
        let inSkippedCount = 0, inHistory = [], inIsAnswerChecked = false, lastQuestionScore = 0;

        function initInputQueue(customPool = null) { 
            inTotalPool = customPool ? [...customPool] : [...historyData];
            inAvailableWords = [...inTotalPool].sort(() => Math.random() - 0.5); 
            inQuestionNumber = 0; inScoreTotal = 0; inSkippedCount = 0; inHistory = []; inIsAnswerChecked = false; lastQuestionScore = 0;
        }

        function updateInputStats(lastScore = null) {
            if (lastScore !== null) lastQuestionScore = lastScore;
            applyStatCardColor("in-last-card", "in-last-score-text", lastQuestionScore);
            const answeredCount = inHistory.length;
            const avg = answeredCount === 0 ? 0 : Math.round(inScoreTotal / answeredCount);
            applyStatCardColor("in-avg-card", "in-avg-score-text", avg);
        }

        function loadNextInputQuestion() {
            if (!inAvailableWords.length) { showInputSummary(); return; }
            inIsAnswerChecked = false;
            inQuestionNumber++;
            inCurrentWord = inAvailableWords.pop();

            const inp = document.getElementById("input-answer");
            inp.value = ""; inp.disabled = false; inp.style.borderColor = "rgba(255,255,255,0.15)";

            document.getElementById("in-feedback").innerHTML = "";
            document.getElementById("in-check-btn").style.display = "inline-block";
            document.getElementById("in-next-btn").style.display = "none";
            document.getElementById("in-skip-btn").style.display = "inline-block";
            document.getElementById("in-end-btn").style.display = "inline-block";
            
            document.getElementById("in-val-translation").innerText = inCurrentWord.desc;
            document.getElementById("in-progress-text").innerText = `Pytanie: ${inQuestionNumber} / ${inTotalPool.length} | Pominięto: ${inSkippedCount}`;
            
            updateInputStats();
            inp.focus();
        }

        function handleInputStep() {
            if (inIsAnswerChecked) return;
            const inp = document.getElementById("input-answer");
            const val = inp.value.trim();
            const feedbackEl = document.getElementById("in-feedback");

            if (!val) { feedbackEl.innerHTML = "<span class='incorrect'>Wpisz angielskie słówko, aby sprawdzić!</span>"; return; }

            inIsAnswerChecked = true;
            const evalRes = evaluateAnswer(val, inCurrentWord.title);
            inScoreTotal += evalRes.percentage;

            inp.disabled = true;
            let statusText = "";
            if (evalRes.percentage === 100) {
                inp.style.borderColor = "#4CAF50";
                statusText = `<span class='correct'>Dobrze! 🎉</span>`;
            } else {
                inp.style.borderColor = "#f44336";
                statusText = `<span class='incorrect'>Źle! ❌</span>`;
            }

            feedbackEl.innerHTML = `
                ${statusText}<br>
                <div style="font-size: 15px; margin-top: 8px; color: #aaa;">
                    <strong>Prawidłowa odpowiedź:</strong> ${inCurrentWord.title}<br>
                </div>
            `;

            inHistory.push({ item: inCurrentWord, userAnswer: val, eval: evalRes, skipped: false });
            updateInputStats(evalRes.percentage);

            document.getElementById("in-check-btn").style.display = "none";
            document.getElementById("in-next-btn").style.display = "inline-block";
            document.getElementById("in-skip-btn").style.display = "none";
            document.getElementById("in-end-btn").style.display = "inline-block";
        }

        function skipInputQuestion() {
            if (inIsAnswerChecked) return;
            inIsAnswerChecked = true;
            inSkippedCount++;

            const inp = document.getElementById("input-answer");
            inp.disabled = true; inp.style.borderColor = "#888";

            document.getElementById("in-feedback").innerHTML = `
                <span class='skipped-text'>Pominięto. Poprawne angielskie słówko:</span><br>
                <div style="font-size: 15px; margin-top: 5px; color: #00e5ff;">${inCurrentWord.title}</div>
            `;

            inHistory.push({ item: inCurrentWord, userAnswer: "(Pominięto)", eval: { percentage: 0, matched: [], missing: [] }, skipped: true });
            updateInputStats(0);

            document.getElementById("in-check-btn").style.display = "none";
            document.getElementById("in-next-btn").style.display = "inline-block";
            document.getElementById("in-skip-btn").style.display = "none";
            document.getElementById("in-end-btn").style.display = "inline-block";
        }

        function showInputSummary() {
            const box = document.getElementById("in-quiz-box");
            let retryWords = [];

            let listHtml = inHistory.map((h, idx) => {
                if (h.skipped || h.eval.percentage < 100) retryWords.push(h.item);
                if (h.skipped) {
                    return `
                        <div class="summary-item skipped">
                            <div class="summary-item-content">
                                <div><span class="summary-num">${idx + 1}.</span><span class="summary-word">${h.item.desc}</span></div>
                                <div class="summary-details"><span class="text-skipped">Angielski: ${h.item.title}</span></div>
                            </div>
                            <div class="summary-score-badge">0%</div>
                        </div>
                    `;
                }
                const statusClass = h.eval.percentage === 100 ? 'perfect' : 'failed';
                return `
                    <div class="summary-item ${statusClass}">
                        <div class="summary-item-content">
                            <div><span class="summary-num">${idx + 1}.</span><span class="summary-word">${h.item.desc}</span></div>
                            <div class="summary-details">Twoja odpowiedź: <em>${h.userAnswer}</em><br>Wzorzec (ang.): <span class="text-correct">${h.item.title}</span></div>
                        </div>
                        <div class="summary-score-badge">${h.eval.percentage}%</div>
                    </div>
                `;
            }).join('');

            const avgPercent = inHistory.length > 0 ? Math.round(inScoreTotal / inHistory.length) : 0;
            window.inWrongWordsCache = retryWords;

            let retryBtnHtml = retryWords.length > 0 
                ? `<button class="btn-action btn-retry-wrong" onclick="retryInputWrongWords()">Powtórz Błędne (${retryWords.length})</button>`
                : '';

            box.innerHTML = `
                <a href="#" class="quiz-reset-btn" onclick="restartInputQuiz(); return false;" title="Resetuj">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </a>
                <h1>Koniec Quizu! 🎉</h1>
                <div class="summary-score">Twój średni wynik dopasowania: <strong>${avgPercent}%</strong></div>
                <div class="summary-container">
                    <div class="summary-title">Podsumowanie odpowiedzi:</div>
                    <div class="summary-list">${listHtml}</div>
                </div>
                <div class="summary-footer-bar">
                    <button class="btn-action" onclick="restartInputQuiz()">Zagraj ponownie</button>
                    ${retryBtnHtml}
                </div>
            `;
        }

        function retryInputWrongWords() {
            if (!window.inWrongWordsCache || !window.inWrongWordsCache.length) return;
            const wrongPool = [...window.inWrongWordsCache];
            
            const box = document.getElementById("in-quiz-box");
            box.innerHTML = `
                <a href="#" class="quiz-reset-btn" onclick="restartInputQuiz(); return false;" title="Resetuj quiz">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </a>
                <h1>Quiz: Wpisz angielskie słówko</h1>
                <div class="stats-grid">
                    <div class="stat-card" id="in-last-card">
                        <div class="stat-card-title">Ostatnie pytanie</div>
                        <div class="stat-card-value" id="in-last-score-text">0%</div>
                    </div>
                    <div class="stat-card" id="in-avg-card">
                        <div class="stat-card-title">Średnia celność</div>
                        <div class="stat-card-value" id="in-avg-score-text">0%</div>
                    </div>
                </div>
                <div class="counter" id="in-progress-text"></div>
                <div class="translation-box">
                    <div class="translation-label">Znaczenie po polsku:</div>
                    <div class="translation-value" id="in-val-translation">-</div>
                </div>
                <div class="input-group">
                    <div class="input-label">Wpisz po angielsku...</div>
                    <input type="text" id="input-answer" placeholder="Wpisz po angielsku..." autocomplete="off">
                </div>
                <div class="action-buttons-wrapper">
                    <button class="btn-action" id="in-check-btn" onclick="handleInputStep()">Sprawdź</button>
                    <button class="btn-action btn-next" id="in-next-btn" onclick="loadNextInputQuestion()" style="display: none;">Następne pytanie</button>
                    <button class="btn-action btn-skip" id="in-skip-btn" onclick="skipInputQuestion()">Pomiń pytanie</button>
                    <button class="btn-action btn-end" id="in-end-btn" onclick="showInputSummary()">Zakończ quiz</button>
                </div>
                <div class="feedback" id="in-feedback"></div>
            `;
            initInputQueue(wrongPool);
            loadNextInputQuestion();
        }

        function restartInputQuiz() { location.reload(); }

        document.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                if (!inIsAnswerChecked) handleInputStep();
                else loadNextInputQuestion();
            }
        });

        window.onload = function() {
            initInputQueue();
            loadNextInputQuestion();
        };
    </script>
</body>
</html>
