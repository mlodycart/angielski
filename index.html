<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czasowniki Nieregularne - Centrum Nauki</title>
    <!-- Podpięcie czcionki Space Grotesk z Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        /* Zapobieganie skakaniu menu przez pojawianie/znikanie paska przewijania */
        html {
            scrollbar-gutter: stable;
            overflow-y: scroll;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Nawigacja Główna */
        nav {
            width: 100%;
            background-color: #1a1a1a;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 16px 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-btn {
            background-color: #2a2a2a;
            color: #ccc;
            border: 2px solid #444;
            padding: 14px 24px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .nav-btn:hover {
            background-color: #3d3d3d;
            color: #fff;
        }
        .nav-btn.active {
            background-color: #4CAF50;
            color: #ffffff;
            border-color: #4CAF50;
        }

        /* Kontenery Treści */
        .tab-content {
            display: none;
            width: 100%;
            max-width: 1250px;
            padding: 30px 20px;
        }
        .tab-content.active {
            display: block;
        }

        /* TABELA STYL */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            font-size: 18px;
            min-width: 600px; /* Zapewnia brak ściskania kolumn na bardzo małych ekranach */
        }
        th, td {
            padding: 18px 20px;
            text-align: left;
            border-bottom: 1px solid #2a2a2a;
        }
        th {
            background-color: #0d0d0d;
            font-weight: 700;
            font-size: 20px;
            border-bottom: 2px solid #444;
            color: #4CAF50;
        }
        tr:nth-child(even) {
            background-color: #242424;
        }
        .phonetic {
            color: #aaaaaa;
            font-size: 0.9em;
        }

        /* QUIZ STYL */
        .quiz-container {
            background-color: #2d2d2d;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            max-width: 1200px;
            margin: 10px auto;
        }
        h1 {
            color: #4CAF50;
            margin-top: 0;
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .translation-box {
            background-color: #3d3d3d;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
        }
        .translation-label {
            font-size: 16px;
            color: #aaaaaa;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .translation-value {
            font-size: 46px;
            font-weight: 700;
            color: #ff9800;
            word-break: break-word;
        }
        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            text-align: left;
        }
        .input-group {
            background-color: #3d3d3d;
            padding: 20px;
            border-radius: 14px;
        }
        .input-label {
            font-size: 15px;
            color: #aaaaaa;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        input[type="text"] {
            width: 100%;
            padding: 16px 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 22px;
            border: 3px solid #555;
            border-radius: 10px;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #4CAF50;
            outline: none;
        }
        input:disabled {
            background-color: #262626;
            color: #dddddd;
            border-color: #444;
        }
        
        /* ABCD QUIZ STYL */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 30px;
        }
        .option-btn {
            background-color: #3d3d3d;
            color: white;
            border: 3px solid #555;
            padding: 20px 24px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 22px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            width: 100%;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #4d4d4d;
            border-color: #4CAF50;
        }
        .option-btn.correct-ans {
            background-color: #2e7d32 !important;
            border-color: #4CAF50 !important;
        }
        .option-btn.wrong-ans {
            background-color: #c62828 !important;
            border-color: #f44336 !important;
        }

        /* PRZYCISKI I POMOCNICZE */
        .btn-action {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 18px 40px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 22px;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 5px;
            width: 100%;
            max-width: 320px;
        }
        .btn-action:hover {
            background-color: #45a049;
        }
        .btn-next {
            background-color: #2196F3 !important;
            display: none;
        }
        .btn-next:hover {
            background-color: #1976D2 !important;
        }
        .feedback {
            margin-top: 25px;
            font-size: 22px;
            font-weight: 700;
            min-height: 40px;
            line-height: 1.4;
        }
        .correct { color: #4CAF50; }
        .incorrect { color: #f44336; }
        .counter {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 15px;
        }

        /* MEDIA QUERIES - RESPONSYWNOŚĆ NA TELEFONY */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                padding: 12px 15px;
                gap: 8px;
            }
            .nav-btn {
                width: 100%;
                font-size: 16px;
                padding: 12px 16px;
            }
            .tab-content {
                padding: 15px 10px;
            }
            .quiz-container {
                padding: 25px 15px;
                border-radius: 14px;
            }
            h1 {
                font-size: 26px;
            }
            .translation-value {
                font-size: 34px;
            }
            .inputs-grid {
                grid-template-columns: 1fr; /* Zmiana układu na 1 kolumnę na telefonach */
                gap: 15px;
            }
            input[type="text"] {
                font-size: 20px;
                padding: 14px 10px;
            }
            .option-btn {
                font-size: 18px;
                padding: 16px 18px;
            }
            .btn-action {
                font-size: 18px;
                padding: 16px 20px;
                max-width: 100%;
            }
            th, td {
                padding: 12px 14px;
                font-size: 16px;
            }
            th {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <!-- Menu Nawigacyjne -->
    <nav>
        <button id="btn-table-tab" class="nav-btn" onclick="switchTab('table-tab')">Tabela Słówek</button>
        <button id="btn-input-quiz-tab" class="nav-btn" onclick="switchTab('input-quiz-tab')">Quiz: Wpisywanie</button>
        <button id="btn-abcd-quiz-tab" class="nav-btn" onclick="switchTab('abcd-quiz-tab')">Quiz: Wybór (ABCD)</button>
    </nav>

    <!-- ZAKŁADKA 1: TABELA -->
    <div id="table-tab" class="tab-content">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Infinitive</th>
                        <th>Past Simple</th>
                        <th>Past Participle</th>
                        <th>Tłumaczenie</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Tabela generowana dynamicznie w JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ZAKŁADKA 2: QUIZ WPISYWANIE -->
    <div id="input-quiz-tab" class="tab-content">
        <div class="quiz-container">
            <h1>Quiz: Wpisz Formy Krok po Kroku</h1>
            <div class="counter" id="in-counter-text"></div>
            <div class="counter" id="in-progress-text" style="color: #4CAF50; margin-top: -8px; margin-bottom: 20px; font-weight: 700;"></div>
            
            <div class="translation-box">
                <div class="translation-label">Tłumaczenie (Polski)</div>
                <div class="translation-value" id="in-val-translation">-</div>
            </div>

            <div class="inputs-grid">
                <div class="input-group">
                    <div class="input-label">Infinitive</div>
                    <input type="text" id="input-0" placeholder="Wpisz..." autocomplete="off" autocapitalize="none">
                </div>
                <div class="input-group">
                    <div class="input-label">Past Simple</div>
                    <input type="text" id="input-1" placeholder="Wpisz..." autocomplete="off" autocapitalize="none" disabled>
                </div>
                <div class="input-group">
                    <div class="input-label">Past Participle</div>
                    <input type="text" id="input-2" placeholder="Wpisz..." autocomplete="off" autocapitalize="none" disabled>
                </div>
            </div>

            <button class="btn-action" id="in-check-btn" onclick="handleInputStep()">Sprawdź</button>
            <button class="btn-action btn-next" id="in-next-btn" onclick="loadNextInputQuestion()">Następne słówko</button>

            <div class="feedback" id="in-feedback"></div>
        </div>
    </div>

    <!-- ZAKŁADKA 3: QUIZ ABCD -->
    <div id="abcd-quiz-tab" class="tab-content">
        <div class="quiz-container">
            <h1>Quiz: Wybierz Poprawne Formy</h1>
            <div class="counter" id="abcd-counter-text"></div>
            <div class="counter" id="abcd-progress-text" style="color: #4CAF50; margin-top: -8px; margin-bottom: 20px; font-weight: 700;"></div>
            
            <div class="translation-box">
                <div class="translation-label">Tłumaczenie (Polski)</div>
                <div class="translation-value" id="abcd-val-translation">-</div>
            </div>

            <div class="options-grid" id="abcd-options-container">
                <!-- Opcje wyboru -->
            </div>

            <button class="btn-action btn-next" id="abcd-next-btn" onclick="loadNextAbcdQuestion()">Następne słówko</button>

            <div class="feedback" id="abcd-feedback"></div>
        </div>
    </div>

            { infinitive: "think", pastSimple: "thought", pastParticiple: "thought", translation: "myśleć", phon: ["/θɪŋk/", "/θɔːt/", "/θɔːt/"] },
            { infinitive: "throw", pastSimple: "threw", pastParticiple: "thrown", translation: "rzucać", phon: ["/θrəʊ/", "/θruː/", "/θrəʊn/"] },
            { infinitive: "thrust", pastSimple: "thrust", pastParticiple: "thrust", translation: "pchnąć", phon: ["/θrʌst/", "/θrʌst/", "/θrʌst/"] },
            { infinitive: "tread", pastSimple: "trod", pastParticiple: "trodden", translation: "stąpać", phon: ["/tred/", "/trɒd/", "/ˈtrɒdn/"] },
            { infinitive: "undergo", pastSimple: "underwent", pastParticiple: "undergone", translation: "poddać się czemuś, przejść", phon: ["/ˌʌndəˈɡəʊ/", "/ˌʌndəˈwent/", "/ˌʌndəˈɡɒn/"] },
            { infinitive: "understand", pastSimple: "understood", pastParticiple: "understood", translation: "rozumieć", phon: ["/ˌʌndəˈstænd/", "/ˌʌndəˈstʊd/", "/ˌʌndəˈstʊd/"] },
            { infinitive: "upset", pastSimple: "upset", pastParticiple: "upset", translation: "zasmucić", phon: ["/ʌpˈset/", "/ʌpˈset/", "/ʌpˈset/"] },
            { infinitive: "wake", pastSimple: "woke", pastParticiple: "woken", translation: "obudzić się", phon: ["/weɪk/", "/weʊk/", "/ˈweʊkən/"] },
            { infinitive: "weave", pastSimple: "wove", pastParticiple: "woven", translation: "tkać", phon: ["/wiːv/", "/wəʊv/", "/ˈwəʊvən/"] },
            { infinitive: "wear", pastSimple: "wore", pastParticiple: "worn", translation: "nosić", phon: ["/weə/", "/wɔː/", "/wɔːn/"] },
            { infinitive: "win", pastSimple: "won", pastParticiple: "won", translation: "wygrać", phon: ["/wɪn/", "/wʌn/", "/wʌn/"] },
            { infinitive: "wind", pastSimple: "wound", pastParticiple: "wound", translation: "nawijać, nakręcić", phon: ["/waɪnd/", "/waʊnd/", "/waʊnd/"] },
            { infinitive: "withdraw", pastSimple: "withdrew", pastParticiple: "withdrawn", translation: "wycofać się", phon: ["/wɪðˈdrɔː/", "/wɪðˈdruː/", "/wɪðˈdrɔːn/"] },
            { infinitive: "wring", pastSimple: "wrung", pastParticiple: "wrung", translation: "wykręcić, wycisnąć", phon: ["/rɪŋ/", "/rʌŋ/", "/rʌŋ/"] },
            { infinitive: "write", pastSimple: "wrote", pastParticiple: "written", translation: "pisać", phon: ["/raɪt/", "/rəʊt/", "/ˈrɪtn/"] }
        ];

        // LOGIKA NAWIGACJI Z ZAPISYWANIEM OSTATNIEJ ZAKŁADKI
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            const selectedTab = document.getElementById(tabId);
            const selectedBtn = document.getElementById("btn-" + tabId);

            if (selectedTab && selectedBtn) {
                selectedTab.classList.add('active');
                selectedBtn.classList.add('active');
                localStorage.setItem('activeTab', tabId);
            }
        }

        // GENEROWANIE TABELI
        function buildTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = originalWords.map(w => `
                <tr>
                    <td>${w.infinitive} <span class="phonetic">${w.phon ? w.phon[0] : ''}</span></td>
                    <td>${w.pastSimple} <span class="phonetic">${w.phon ? w.phon[1] : ''}</span></td>
                    <td>${w.pastParticiple} <span class="phonetic">${w.phon ? w.phon[2] : ''}</span></td>
                    <td>${w.translation}</td>
                </tr>
            `).join('');
        }

        // LOGIKA QUIZU - WPISYWANIE
        let inAvailableWords = [];
        let inCurrentWord = {};
        let inScoreCorrect = 0;
        let inScoreTotal = 0;
        let inQuestionNumber = 0;
        let inCurrentStep = 0;

        function initInputQueue() {
            inAvailableWords = [...originalWords];
            for (let i = inAvailableWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [inAvailableWords[i], inAvailableWords[j]] = [inAvailableWords[j], inAvailableWords[i]];
            }
            inQuestionNumber = 0;
        }

        function loadNextInputQuestion() {
            if (inAvailableWords.length === 0) initInputQueue();

            inQuestionNumber++;
            inCurrentWord = inAvailableWords.pop();
            inCurrentStep = 0;

            for (let i = 0; i < 3; i++) {
                const input = document.getElementById("input-" + i);
                input.value = "";
                input.disabled = (i !== 0);
                input.style.borderColor = "#555";
            }

            document.getElementById("in-feedback").innerHTML = "";
            document.getElementById("in-next-btn").style.display = "none";
            document.getElementById("in-check-btn").style.display = "inline-block";
            document.getElementById("in-val-translation").innerText = inCurrentWord.translation;

            document.getElementById("in-counter-text").innerText = `Statystyki: Poprawne ${inScoreCorrect} / Wszystkie ${inScoreTotal}`;
            document.getElementById("in-progress-text").innerText = `Słówko: ${inQuestionNumber} / ${originalWords.length}`;
            
            document.getElementById("input-0").focus();
        }

        function checkField(userInput, correctAnswer) {
            userInput = userInput.trim().toLowerCase();
            correctAnswer = correctAnswer.toLowerCase();
            if (userInput === correctAnswer) return true;
            if (correctAnswer.includes("/")) {
                let parts = correctAnswer.split("/").map(s => s.trim());
                if (parts.includes(userInput)) return true;
            }
            return false;
        }

        function handleInputStep() {
            const inputField = document.getElementById("input-" + inCurrentStep);
            const userInput = inputField.value.trim();
            const feedbackEl = document.getElementById("in-feedback");

            if (userInput === "") {
                feedbackEl.innerHTML = "<span class='incorrect'>Musisz coś wpisać!</span>";
                return;
            }

            inScoreTotal++;
            let correctAnswers = [inCurrentWord.infinitive, inCurrentWord.pastSimple, inCurrentWord.pastParticiple];
            let isOk = checkField(userInput, correctAnswers[inCurrentStep]);

            inputField.disabled = true;

            if (isOk) {
                inScoreCorrect++;
                inputField.style.borderColor = "#4CAF50";
                feedbackEl.innerHTML = "<span class='correct'>Dobrze! 🎉</span>";
            } else {
                inputField.style.borderColor = "#f44336";
                feedbackEl.innerHTML = `<span class='incorrect'>Źle. Poprawna forma to: <strong>${correctAnswers[inCurrentStep]}</strong></span>`;
            }

            document.getElementById("in-counter-text").innerText = `Statystyki: Poprawne ${inScoreCorrect} / Wszystkie ${inScoreTotal}`;

            inCurrentStep++;

            if (inCurrentStep < 3) {
                const nextInput = document.getElementById("input-" + inCurrentStep);
                nextInput.disabled = false;
                nextInput.focus();
            } else {
                document.getElementById("in-check-btn").style.display = "none";
                document.getElementById("in-next-btn").style.display = "inline-block";
                document.getElementById("in-next-btn").focus();
            }
        }

        // Obsługa wciśnięcia Enter / Przejdź na klawiaturze telefonu
        document.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && document.getElementById('input-quiz-tab').classList.contains('active')) {
                if (inCurrentStep < 3) {
                    handleInputStep();
                } else if (document.getElementById("in-next-btn").style.display !== "none") {
                    loadNextInputQuestion();
                }
            }
        });

        // LOGIKA QUIZU - ABCD
        let abcdAvailableWords = [];
        let abcdCurrentWord = {};
        let abcdScoreCorrect = 0;
        let abcdScoreTotal = 0;
        let abcdQuestionNumber = 0;

        function initAbcdQueue() {
            abcdAvailableWords = [...originalWords];
            for (let i = abcdAvailableWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [abcdAvailableWords[i], abcdAvailableWords[j]] = [abcdAvailableWords[j], abcdAvailableWords[i]];
            }
            abcdQuestionNumber = 0;
        }

        function formatWordString(wordObj) {
            return `${wordObj.infinitive}, ${wordObj.pastSimple}, ${wordObj.pastParticiple}`;
        }

        function loadNextAbcdQuestion() {
            if (abcdAvailableWords.length === 0) initAbcdQueue();

            abcdQuestionNumber++;
            abcdCurrentWord = abcdAvailableWords.pop();

            document.getElementById("abcd-feedback").innerHTML = "";
            document.getElementById("abcd-next-btn").style.display = "none";
            document.getElementById("abcd-val-translation").innerText = abcdCurrentWord.translation;

            document.getElementById("abcd-counter-text").innerText = `Statystyki: Poprawne ${abcdScoreCorrect} / Wszystkie ${abcdScoreTotal}`;
            document.getElementById("abcd-progress-text").innerText = `Słówko: ${abcdQuestionNumber} / ${originalWords.length}`;

            const correctAnswerStr = formatWordString(abcdCurrentWord);

            let otherWords = originalWords.filter(w => w.infinitive !== abcdCurrentWord.infinitive);
            for (let i = otherWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [otherWords[i], otherWords[j]] = [otherWords[j], otherWords[i]];
            }

            let options = [
                { text: correctAnswerStr, isCorrect: true },
                { text: formatWordString(otherWords[0]), isCorrect: false },
                { text: formatWordString(otherWords[1]), isCorrect: false }
            ];

            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }

            const optionsContainer = document.getElementById("abcd-options-container");
            optionsContainer.innerHTML = "";

            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt.text;
                btn.onclick = () => handleAbcdAnswer(btn, opt.isCorrect, correctAnswerStr);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAbcdAnswer(selectedBtn, isCorrect, correctAnswerStr) {
            abcdScoreTotal++;
            
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === correctAnswerStr) {
                    btn.classList.add("correct-ans");
                }
            });

            const feedbackEl = document.getElementById("abcd-feedback");

            if (isCorrect) {
                abcdScoreCorrect++;
                feedbackEl.innerHTML = "<span class='correct'>Dobrze! 🎉</span>";
            } else {
                selectedBtn.classList.add("wrong-ans");
                feedbackEl.innerHTML = `<span class='incorrect'>Źle. Poprawna odpowiedź to: <strong>${correctAnswerStr}</strong></span>`;
            }

            document.getElementById("abcd-counter-text").innerText = `Statystyki: Poprawne ${abcdScoreCorrect} / Wszystkie ${abcdScoreTotal}`;
            document.getElementById("abcd-next-btn").style.display = "inline-block";
            document.getElementById("abcd-next-btn").focus();
        }

        // INICJALIZACJA STARTOWA Z ODCZYTEM ZAKŁADKI
        window.onload = function() {
            buildTable();
            initInputQueue();
            loadNextInputQuestion();
            initAbcdQueue();
            loadNextAbcdQuestion();

            // Przywracanie ostatnio wybranej zakładki (lub domyślnie tabeli)
            const savedTab = localStorage.getItem('activeTab') || 'table-tab';
            switchTab(savedTab);
        };
    </script>
</body>
</html>
