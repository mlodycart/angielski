<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Słówka - Centrum Nauki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html { scrollbar-gutter: stable; overflow-y: scroll; }
        body { background-color: #121212; color: #fff; font-family: 'Space Grotesk', sans-serif; font-weight: 500; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        nav { width: 100%; background-color: #1a1a1a; border-bottom: 2px solid #333; display: flex; justify-content: center; gap: 12px; padding: 16px 10px; }
        .nav-btn { background-color: #2a2a2a; color: #ccc; border: 2px solid #444; padding: 14px 24px; font-family: inherit; font-size: 18px; font-weight: 700; border-radius: 10px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .nav-btn:hover { background-color: #3d3d3d; color: #fff; }
        .nav-btn.active { background-color: #4CAF50; color: #fff; border-color: #4CAF50; }
        .tab-content { display: none; width: 100%; max-width: 1350px; padding: 30px 20px 80px 20px; }
        .tab-content.active { display: block; }
        
        .table-header-bar { 
            position: sticky; 
            top: 20px; 
            z-index: 1000; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 20px; 
            margin-bottom: 25px; 
            background-color: #1a1a1a; 
            padding: 24px 32px; 
            border-radius: 16px; 
            border: 1px solid #333; 
            flex-wrap: wrap; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        
        .zoom-controls { display: flex; align-items: center; gap: 14px; }
        .zoom-controls span { font-size: 22px; color: #aaa; font-weight: 700; }
        
        .zoom-btn { 
            background-color: #262626; color: white; border: 2px solid #444; 
            width: 56px; height: 56px; font-size: 26px; font-weight: 700; 
            border-radius: 12px; cursor: pointer; touch-action: manipulation; 
            display: inline-flex; align-items: center; justify-content: center; 
            transition: background-color 0.2s, border-color 0.2s, color 0.2s; padding: 0; box-sizing: border-box;
            text-decoration: none;
        }
        .zoom-btn:hover { border-color: #ffd700; background-color: #333333; color: #ffd700; }
        .zoom-btn:active { background-color: #ffd700; color: #000; }
        #zoom-level-text { font-size: 22px; color: #ffd700; min-width: 75px; text-align: center; font-weight: 700; }
        
        .search-box { position: relative; display: flex; align-items: center; flex-grow: 1; max-width: 500px; height: 56px; }
        
        input[type="search"]::-webkit-search-decoration,
        input[type="search"]::-webkit-search-cancel-button,
        input[type="search"]::-webkit-search-results-button,
        input[type="search"]::-webkit-search-results-decoration {
            -webkit-appearance: none;
            display: none;
        }

        .search-input { width: 100%; height: 56px; padding: 0 58px 0 20px; font-family: inherit; font-size: 20px; border: 2px solid #444; border-radius: 12px; background-color: #262626; color: white; outline: none; box-sizing: border-box; }
        .search-input:focus { border-color: #ffd700; }
        
        .clear-search-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #ffd700;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 4px;
            font-size: 30px;
            font-weight: 900;
            -webkit-text-stroke: 1.2px #ffd700;
            line-height: 1;
            transition: transform 0.1s;
        }
        .clear-search-btn:hover {
            color: #ffd700;
            transform: translateY(-50%) scale(1.1);
        }
        
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; touch-action: pan-x pan-y; }
        #table-zoom-wrapper { transform-origin: top left; transition: transform 0.1s ease-out; width: 100%; }
        
        table { width: 100%; border-collapse: collapse; background-color: #1a1a1a; border-radius: 12px; overflow: hidden; font-size: 18px; min-width: 600px; table-layout: fixed; }
        th, td { padding: 18px 20px; text-align: left; border-bottom: 1px solid #2a2a2a; transition: background-color 0.3s, color 0.3s; width: 50%; word-wrap: break-word; }
        th { background-color: #0d0d0d; font-weight: 700; font-size: 20px; border-bottom: 2px solid #444; color: #ffd700; }
        tr:nth-child(even) { background-color: #242424; }
        tr.highlighted-row { background-color: #ffd700 !important; color: #000 !important; font-weight: bold; }
        tr.highlighted-row td { color: #000 !important; }
        
        .quiz-container { background-color: #2d2d2d; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); text-align: center; max-width: 1200px; margin: 10px auto; position: relative; }
        
        .quiz-reset-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #262626;
            border: 2px solid #555;
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        .quiz-reset-btn:hover { background-color: #333333; border-color: #ffd700; color: #ffd700; }

        h1 { color: #4CAF50; margin-top: 0; font-size: 38px; font-weight: 700; margin-bottom: 15px; }
        .translation-box { background-color: #3d3d3d; padding: 25px; border-radius: 16px; margin-bottom: 30px; }
        .translation-label { font-size: 16px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.5px; }
        .translation-value { font-size: 46px; font-weight: 700; color: #ffd700; word-break: break-word; }
        
        .input-single-group { background-color: #3d3d3d; padding: 20px; border-radius: 14px; margin-bottom: 30px; text-align: left; }
        .input-label { font-size: 15px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        
        input[type="text"], input[type="search"] { width: 100%; padding: 16px 12px; font-family: inherit; font-weight: 700; font-size: 22px; border: 3px solid #555; border-radius: 10px; background-color: #262626; color: white; text-align: center; box-sizing: border-box; }
        input[type="text"]:focus { border-color: #4CAF50; outline: none; }
        input[type="search"]:focus { border-color: #ffd700; outline: none; }
        input:disabled { background-color: #262626; color: #888; border-color: #555; opacity: 1; }
        
        .options-grid { display: flex; flex-direction: column; gap: 16px; margin-bottom: 30px; }
        .option-btn { background-color: #3d3d3d; color: white; border: 3px solid #555; padding: 20px 24px; font-family: inherit; font-weight: 700; font-size: 22px; border-radius: 14px; cursor: pointer; transition: all 0.2s; text-align: left; width: 100%; }
        .option-btn:hover:not(:disabled) { background-color: #4d4d4d; border-color: #ffd700; color: #ffd700; }
        .option-btn.correct-ans { background-color: #2e7d32 !important; border-color: #4CAF50 !important; color: #fff !important; }
        .option-btn.wrong-ans { background-color: #c62828 !important; border-color: #f44336 !important; }
        
        .btn-action { background-color: #4CAF50; color: white; border: none; padding: 18px 40px; font-family: inherit; font-weight: 700; font-size: 22px; border-radius: 12px; cursor: pointer; transition: background-color 0.3s; margin: 5px; width: 100%; max-width: 320px; }
        .btn-action:hover { background-color: #45a049; }
        .btn-next { background-color: #2196F3 !important; display: none; }
        .btn-next:hover { background-color: #1976D2 !important; }
        .btn-skip { background-color: #757575 !important; }
        .btn-skip:hover { background-color: #616161 !important; }
        .btn-end { background-color: #e53935 !important; border: none; }
        .btn-end:hover { background-color: #c62828 !important; }

        .btn-retry-wrong { background-color: #ff9800 !important; }
        .btn-retry-wrong:hover { background-color: #e68a00 !important; }

        .feedback { margin-top: 25px; font-size: 22px; font-weight: 700; min-height: 40px; line-height: 1.4; }
        .correct { color: #4CAF50; }
        .incorrect { color: #f44336; }
        .skipped-text { color: #aaa; }
        .counter { font-size: 18px; color: #aaa; margin-bottom: 15px; }

        .summary-container { text-align: left; margin-top: 20px; }
        .summary-title { font-size: 28px; color: #4CAF50; font-weight: 700; text-align: center; margin-bottom: 20px; }
        .summary-score { font-size: 22px; text-align: center; margin-bottom: 30px; color: #fff; }
        
        .summary-list { 
            background-color: #1e1e1e; 
            border-radius: 12px; 
            padding: 15px; 
            border: 2px solid #444; 
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .summary-item {
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid #555;
            flex-wrap: wrap;
            gap: 10px;
        }

        .summary-item.perfect { border-left-color: #4CAF50; }
        .summary-item.failed { border-left-color: #f44336; }
        .summary-item.skipped { border-left-color: #888888; background-color: #222222; }

        .summary-item-content { flex-grow: 1; font-size: 18px; line-height: 1.5; }
        .summary-num { font-weight: bold; color: #888; margin-right: 8px; }
        .summary-word { font-weight: bold; font-size: 20px; }
        
        .summary-translation-badge {
            background-color: #ffd700;
            color: #000;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 6px;
            display: inline-block;
        }

        .summary-score-badge {
            font-size: 20px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 8px;
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            white-space: nowrap;
        }

        .summary-details {
            font-size: 15px;
            margin-top: 6px;
            color: #ccc;
        }
        .text-correct { color: #4CAF50; font-weight: bold; }
        .text-wrong { color: #f44336; font-weight: bold; text-decoration: line-through; }
        .text-skipped { color: #888; font-style: normal; }

        .summary-footer-bar {
            position: sticky;
            bottom: 20px;
            z-index: 1000;
            margin-top: 25px;
            background-color: #2d2d2d;
            padding: 16px 20px;
            border-radius: 20px;
            border: 0 solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            flex-wrap: wrap;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .action-buttons-wrapper {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
        }

        @media (max-width: 768px) {
            nav { flex-direction: column; padding: 10px; gap: 8px; }
            .nav-btn { width: 100%; font-size: 16px; padding: 12px; }
            
            .table-header-bar { 
                flex-direction: column; 
                align-items: stretch; 
                top: 10px; 
                padding: 18px 16px; 
                gap: 12px;
                border-radius: 12px;
            }
            .zoom-controls { 
                display: flex;
                justify-content: space-between; 
                align-items: center;
                width: 100%; 
            }
            .zoom-controls span { font-size: 18px; }
            .zoom-btn { width: 48px; height: 48px; font-size: 20px; }
            #zoom-level-text { font-size: 18px; min-width: 55px; }
            
            .search-box { width: 100%; max-width: 100%; height: 48px; }
            .search-input { height: 48px; font-size: 18px; padding: 0 48px 0 12px; text-align: left; }
            .clear-search-btn { right: 12px; font-size: 30px; }

            .tab-content { padding: 10px 5px 80px 5px; }
            .quiz-container { padding: 20px 12px; border-radius: 14px; }
            .quiz-reset-btn { top: 12px; right: 12px; width: 44px; height: 44px; }
            h1 { font-size: 24px; }
            .translation-value { font-size: 30px; }
            input[type="text"], input[type="search"] { font-size: 18px; padding: 12px 8px; }
            .option-btn { font-size: 16px; padding: 14px; }
            .btn-action { font-size: 18px; padding: 14px; max-width: 100%; }
            th, td { padding: 10px 8px; font-size: 15px; }
            
            .summary-item { flex-direction: column; align-items: flex-start; }
            .summary-score-badge { align-self: flex-end; }
            .summary-footer-bar { bottom: 10px; padding: 12px; border-radius: 14px; }
        }
    </style>
</head>
<body>

    <nav>
        <button id="btn-table-tab" class="nav-btn" onclick="switchTab('table-tab')">Tabela Słówek</button>
        <button id="btn-input-quiz-tab" class="nav-btn" onclick="switchTab('input-quiz-tab')">Quiz: Wpisywanie</button>
        <button id="btn-abcd-quiz-tab" class="nav-btn" onclick="switchTab('abcd-quiz-tab')">Quiz: Wybór (ABCD)</button>
    </nav>

    <div id="table-tab" class="tab-content">
        <div class="table-header-bar">
            <div class="zoom-controls">
                <span>Rozmiar:</span>
                <button class="zoom-btn" onclick="adjustZoom(-0.1)">-</button>
                <span id="zoom-level-text">100%</span>
                <button class="zoom-btn" onclick="adjustZoom(0.1)">+</button>
                <button class="zoom-btn" onclick="resetZoom()" title="Resetuj zoom">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </button>
            </div>
            <form class="search-box" action="javascript:void(0);" onsubmit="searchTable(); return false;">
                <input type="search" id="table-search-input" class="search-input" placeholder="Szukaj..." autocomplete="off" enterkeyhint="search" oninput="toggleClearButton()">
                <button type="button" id="clear-search-btn" class="clear-search-btn" onclick="clearSearch()" title="Wyczyść wyszukiwanie">&#10005;</button>
            </form>
        </div>

        <div class="table-responsive" id="table-container">
            <div id="table-zoom-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Angielskie słówko</th>
                            <th>Tłumaczenie (Polski)</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="input-quiz-tab" class="tab-content">
        <div class="quiz-container" id="in-quiz-box">
            <a href="#" class="quiz-reset-btn" onclick="restartInputQuiz(); return false;" title="Resetuj quiz">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
            </a>
            <h1>Quiz: Wpisz Angielskie Słówko</h1>
            <div class="counter" id="in-counter-text"></div>
            <div class="counter" id="in-progress-text" style="color: #4CAF50; margin-top: -8px; margin-bottom: 20px; font-weight: 700;"></div>
            
            <div class="translation-box">
                <div class="translation-label">Polskie tłumaczenie</div>
                <div class="translation-value" id="in-val-word">-</div>
            </div>

            <div class="input-single-group">
                <div class="input-label">Angielskie słówko</div>
                <input type="text" id="input-translation" placeholder="Wpisz po angielsku..." autocomplete="off" autocapitalize="none">
            </div>

            <div class="action-buttons-wrapper">
                <button class="btn-action" id="in-check-btn" onclick="handleInputStep()">Sprawdź</button>
                <button class="btn-action btn-skip" id="in-skip-btn" onclick="skipInputQuestion()">Pomiń słówko</button>
                <button class="btn-action btn-end" id="in-end-btn" onclick="showInputSummary()">Zakończ quiz</button>
                <button class="btn-action btn-next" id="in-next-btn" onclick="loadNextInputQuestion()">Następne słówko</button>
            </div>

            <div class="feedback" id="in-feedback"></div>
        </div>
    </div>

    <div id="abcd-quiz-tab" class="tab-content">
        <div class="quiz-container" id="abcd-quiz-box">
            <a href="#" class="quiz-reset-btn" onclick="restartAbcdQuiz(); return false;" title="Resetuj quiz">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
            </a>
            <h1>Quiz: Wybierz Angielskie Słówko</h1>
            <div class="counter" id="abcd-counter-text"></div>
            <div class="counter" id="abcd-progress-text" style="color: #4CAF50; margin-top: -8px; margin-bottom: 20px; font-weight: 700;"></div>
            
            <div class="translation-box">
                <div class="translation-label">Polskie tłumaczenie</div>
                <div class="translation-value" id="abcd-val-word">-</div>
            </div>

            <div class="options-grid" id="abcd-options-container"></div>

            <div class="action-buttons-wrapper">
                <button class="btn-action btn-skip" id="abcd-skip-btn" onclick="skipAbcdQuestion()">Pomiń słówko</button>
                <button class="btn-action btn-end" id="abcd-end-btn" onclick="showAbcdSummary()">Zakończ quiz</button>
                <button class="btn-action btn-next" id="abcd-next-btn" onclick="loadNextAbcdQuestion()">Następne słówko</button>
            </div>

            <div class="feedback" id="abcd-feedback"></div>
        </div>
    </div>

    <script>
        const rawWords = [
            ["pay off", "opłacać się"],
            ["strengthen", "wzmacniać"],
            ["testimonial", "rekomendacja"],
            ["touristy", "nastawiony na turystów"],
            ["travel overseas", "podróżować za granicę"],
            ["undergo", "przejść (coś), zaznać / doświadczyć (czegoś)"],
            ["venture out", "odważyć się wyjść z domu"],
            ["willing", "chętny, pełen zapału"],
            ["antiseptic wipes", "chusteczki antyseptyczne"],
            ["be seasick", "cierpieć na chorobę morską"],
            ["come out in a rash", "dostać wysypki"],
            ["coverage", "okoliczności objęte polisą ubezpieczeniową"],
            ["diarrhoea", "biegunka"],
            ["emergency", "nagły wypadek"],
            ["first aid kit", "apteczka pierwszej pomocy"],
            ["food poisoning", "zatrucie pokarmowe"],
            ["foresee", "przewidzieć"],
            ["insane", "szalony"],
            ["lean (overboard)", "wychylać się (za burtę)"],
            ["lose valuable items", "stracić cenne przedmioty"],
            ["mosquito repellent", "środek odstraszający komary"],
            ["pandemic", "pandemia"],
            ["risk one's safety for sth", "ryzykować swoje bezpieczeństwo dla czegoś"],
            ["take out travel insurance", "wykupić ubezpieczenie podróżne"],
            ["tick remover tool", "narzędzie do usuwania kleszczy"],
            ["travel mishap", "niefortunny wypadek podczas podróży"],
            ["treat", "udzielić pomocy medycznej, leczyć (czyjeś rany / urazy / choroby)"],
            ["vaccinated", "zaszczepiony"],
            ["vomit", "wymiotować"],
            ["yellow fever", "żółta febra"],
            ["do away with sth", "pozbyć się czegoś"],
            ["do sb good", "mieć na kogoś dobry wpływ, dobrze na kogoś zadziałać"],
            ["do up", "odnowić"],
            ["guided tour", "wycieczka z przewodnikiem"],
            ["make a deal", "zawrzeć umowę, dobić targu"],
            ["make out", "zrozumieć"],
            ["make sth into", "przekształcić coś w"],
            ["make up", "wymyślić, zmyślić"],
            ["zip-lining", "tyrolka, kolejka tyrolska"]
        ];

        const originalWords = rawWords.map(w => ({
            word: w[0], translation: w[1]
        }));

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content, .nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId)?.classList.add('active');
            document.getElementById("btn-" + tabId)?.classList.add('active');
            localStorage.setItem('activeTab', tabId);
        }

        function buildTable() {
            document.getElementById('table-body').innerHTML = originalWords.map((w, idx) => `
                <tr id="row-word-${idx}">
                    <td>${w.word}</td>
                    <td>${w.translation}</td>
                </tr>
            `).join('');
        }

        function toggleClearButton() {
            const input = document.getElementById("table-search-input");
            const clearBtn = document.getElementById("clear-search-btn");
            if (input.value.length > 0) {
                clearBtn.style.display = "flex";
            } else {
                clearBtn.style.display = "none";
            }
        }

        function clearSearch() {
            const input = document.getElementById("table-search-input");
            input.value = "";
            toggleClearButton();
            document.querySelectorAll("#table-body tr").forEach(tr => tr.classList.remove("highlighted-row"));
            input.focus();
        }

        function searchTable() {
            const query = document.getElementById("table-search-input").value.trim().toLowerCase();
            document.querySelectorAll("#table-body tr").forEach(tr => tr.classList.remove("highlighted-row"));
            if (!query) return;

            let matchingIndexes = [];
            originalWords.forEach((w, idx) => {
                const fields = [w.word, w.translation];
                const isMatch = fields.some(field => {
                    const cleanField = field.toLowerCase();
                    if (cleanField.includes(query)) return true;
                    const wordsInField = cleanField.replace(/[\(\)\/\,]/g, ' ').split(/\s+/);
                    return wordsInField.some(part => part.startsWith(query));
                });
                if (isMatch) matchingIndexes.push(idx);
            });

            if (matchingIndexes.length >= 1) {
                const foundIdx = matchingIndexes[0];
                const row = document.getElementById(`row-word-${foundIdx}`);
                if (row) {
                    row.classList.add("highlighted-row");
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
            document.getElementById("table-search-input").blur();
        }

        let currentZoom = parseFloat(localStorage.getItem('tableZoom')) || 1.0;

        function updateZoomDisplay() {
            const wrapper = document.getElementById('table-zoom-wrapper');
            const zoomText = document.getElementById('zoom-level-text');
            if (wrapper && zoomText) {
                wrapper.style.transform = `scale(${currentZoom})`;
                wrapper.style.width = `${100 / currentZoom}%`;
                zoomText.innerText = `${Math.round(currentZoom * 100)}%`;
                localStorage.setItem('tableZoom', currentZoom);
            }
        }

        function adjustZoom(delta) { currentZoom = Math.min(Math.max(0.4, currentZoom + delta), 1.5); updateZoomDisplay(); }
        function resetZoom() { currentZoom = 1.0; updateZoomDisplay(); }

        let initialDistance = -1;
        function initPinchZoom() {
            const container = document.getElementById('table-container');
            container.addEventListener('touchstart', e => { if (e.touches.length === 2) initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); }, { passive: true });
            container.addEventListener('touchmove', e => {
                if (e.touches.length === 2 && initialDistance > 0) {
                    const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    const diff = (dist - initialDistance) / 200;
                    if (Math.abs(diff) > 0.02) { adjustZoom(diff); initialDistance = dist; }
                }
            }, { passive: true });
            container.addEventListener('touchend', e => { if (e.touches.length < 2) initialDistance = -1; });
        }

        // --- QUIZ WPISYWANIE ---
        let inTotalPool = [...originalWords];
        let inAvailableWords = [], inCurrentWord = {}, inScoreCorrect = 0, inScoreTotal = 0, inQuestionNumber = 0;
        let inSkippedCount = 0;
        let inHistory = [];

        function initInputQueue(customPool = null) { 
            inTotalPool = customPool ? [...customPool] : [...originalWords];
            inAvailableWords = [...inTotalPool].sort(() => Math.random() - 0.5); 
            inQuestionNumber = 0; 
            inScoreCorrect = 0; 
            inScoreTotal = 0;
            inSkippedCount = 0;
            inHistory = [];
        }

        function loadNextInputQuestion() {
            if (!inAvailableWords.length) {
                showInputSummary();
                return;
            }
            inQuestionNumber++;
            inCurrentWord = inAvailableWords.pop();

            const inp = document.getElementById("input-translation");
            inp.value = "";
            inp.disabled = false;
            inp.style.borderColor = "#555";

            document.getElementById("in-feedback").innerHTML = "";
            document.getElementById("in-next-btn").style.display = "none";
            document.getElementById("in-check-btn").style.display = "inline-block";
            document.getElementById("in-skip-btn").style.display = "inline-block";
            document.getElementById("in-end-btn").style.display = "inline-block";
            document.getElementById("in-val-word").innerText = inCurrentWord.translation;
            document.getElementById("in-counter-text").innerText = `Statystyki: Poprawne ${inScoreCorrect} / Wszystkie ${inScoreTotal}`;
            document.getElementById("in-progress-text").innerText = `Słówko: ${inQuestionNumber} / ${inTotalPool.length} | Pominięto: ${inSkippedCount} / ${inTotalPool.length}`;
            inp.focus();
        }

        function checkField(userInput, correctAnswer) {
            userInput = userInput.trim().toLowerCase();
            correctAnswer = correctAnswer.toLowerCase();
            return userInput === correctAnswer || (correctAnswer.includes("/") && correctAnswer.split("/").map(s => s.trim()).includes(userInput));
        }

        function handleInputStep() {
            const nextBtn = document.getElementById("in-next-btn");
            if (nextBtn.style.display !== "none") {
                loadNextInputQuestion();
                return;
            }

            const inputField = document.getElementById("input-translation");
            const userInput = inputField.value.trim();
            const feedbackEl = document.getElementById("in-feedback");

            if (!userInput) { feedbackEl.innerHTML = "<span class='incorrect'>Musisz coś wpisać!</span>"; return; }

            inScoreTotal++;
            const isOk = checkField(userInput, inCurrentWord.word);

            inputField.disabled = true;
            if (isOk) {
                inScoreCorrect++;
                inputField.style.borderColor = "#4CAF50";
                feedbackEl.innerHTML = "<span class='correct'>Dobrze! 🎉</span>";
            } else {
                inputField.style.borderColor = "#f44336";
                feedbackEl.innerHTML = `<span class='incorrect'>Źle. Poprawne angielskie słówko to: <strong>${inCurrentWord.word}</strong></span>`;
            }

            inHistory.push({
                word: inCurrentWord,
                userAnswer: userInput,
                isCorrect: isOk,
                skipped: false
            });

            document.getElementById("in-counter-text").innerText = `Statystyki: Poprawne ${inScoreCorrect} / Wszystkie ${inScoreTotal}`;
            document.getElementById("in-check-btn").style.display = "none";
            document.getElementById("in-skip-btn").style.display = "none";
            document.getElementById("in-end-btn").style.display = "none";
            nextBtn.style.display = "inline-block";
            nextBtn.focus();
        }

        function skipInputQuestion() {
            inSkippedCount++;
            inHistory.push({
                word: inCurrentWord,
                userAnswer: "(Pominięto)",
                isCorrect: false,
                skipped: true
            });

            const inp = document.getElementById("input-translation");
            inp.value = inCurrentWord.word;
            inp.disabled = true;
            inp.style.borderColor = "#888";

            document.getElementById("in-feedback").innerHTML = `<span class='skipped-text'>Pominięto słówko. Poprawne angielskie słówko zostało uzupełnione.</span>`;
            document.getElementById("in-check-btn").style.display = "none";
            document.getElementById("in-skip-btn").style.display = "none";
            document.getElementById("in-end-btn").style.display = "none";
            document.getElementById("in-next-btn").style.display = "inline-block";
            document.getElementById("in-next-btn").focus();
        }

        function showInputSummary() {
            const box = document.getElementById("in-quiz-box");
            let retryWords = [];

            let listHtml = inHistory.map((item, idx) => {
                const w = item.word;
                if (item.skipped || !item.isCorrect) {
                    retryWords.push(w);
                }

                if (item.skipped) {
                    return `
                        <div class="summary-item skipped">
                            <div class="summary-item-content">
                                <div>
                                    <span class="summary-num">${idx + 1}.</span>
                                    <span class="summary-word">${w.translation}</span>
                                    <strong style="color: #888; margin-left: 10px;">[Pominięto]</strong>
                                </div>
                                <div class="summary-details">
                                    <span class="text-skipped">${w.word}</span>
                                </div>
                            </div>
                            <div class="summary-score-badge">0/1</div>
                        </div>
                    `;
                }

                const statusClass = item.isCorrect ? 'perfect' : 'failed';
                let detailsHtml = item.isCorrect 
                    ? `<span class="text-correct">${item.userAnswer}</span>`
                    : `<span class="text-wrong">${item.userAnswer}</span> → <span class="text-correct">${w.word}</span>`;

                return `
                    <div class="summary-item ${statusClass}">
                        <div class="summary-item-content">
                            <div>
                                <span class="summary-num">${idx + 1}.</span>
                                <span class="summary-word">${w.translation}</span>
                            </div>
                            <div class="summary-details">${detailsHtml}</div>
                        </div>
                        <div class="summary-score-badge">${item.isCorrect ? '1/1' : '0/1'}</div>
                    </div>
                `;
            }).join('');

            const percent = inHistory.length > 0 ? Math.round((inScoreCorrect/inHistory.length)*100) : 0;
            window.inWrongWordsCache = retryWords;

            let retryBtnHtml = retryWords.length > 0 
                ? `<button class="btn-action btn-retry-wrong" onclick="retryInputWrongWords()">Powtórz błędne (${retryWords.length})</button>`
                : '';

            box.innerHTML = `
                <a href="#" class="quiz-reset-btn" onclick="restartInputQuiz(); return false;" title="Resetuj quiz">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </a>
                <h1>Koniec Quizu! 🎉</h1>
                <div class="summary-score">Twój wynik całkowity: <strong>${inScoreCorrect} / ${inHistory.length}</strong> (${percent}%)</div>
                <div class="summary-container">
                    <div class="summary-title">Podsumowanie odpowiedzi:</div>
                    <div class="summary-list">${listHtml}</div>
                </div>
            `;

            let oldFooter = document.getElementById("in-summary-footer");
            if (oldFooter) oldFooter.remove();

            const footerBar = document.createElement("div");
            footerBar.id = "in-summary-footer";
            footerBar.className = "summary-footer-bar";
            footerBar.innerHTML = `
                <button class="btn-action" onclick="restartInputQuiz()">Zagraj ponownie</button>
                ${retryBtnHtml}
            `;
            document.getElementById("input-quiz-tab").appendChild(footerBar);
        }

        function retryInputWrongWords() {
            if (!window.inWrongWordsCache || !window.inWrongWordsCache.length) return;
            let oldFooter = document.getElementById("in-summary-footer");
            if (oldFooter) oldFooter.remove();
            
            resetInputQuizUI();
            initInputQueue(window.inWrongWordsCache);
            loadNextInputQuestion();
        }

        function resetInputQuizUI() {
            const tab = document.getElementById("input-quiz-tab");
            tab.innerHTML = `
                <div class="quiz-container" id="in-quiz-box">
                    <a href="#" class="quiz-reset-btn" onclick="restartInputQuiz(); return false;" title="Resetuj quiz">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                            <path d="M3 3v5h5"></path>
                        </svg>
                    </a>
                    <h1>Quiz: Wpisz Angielskie Słówko</h1>
                    <div class="counter" id="in-counter-text"></div>
                    <div class="counter" id="in-progress-text" style="color: #4CAF50; margin-top: -8px; margin-bottom: 20px; font-weight: 700;"></div>
                    
                    <div class="translation-box">
                        <div class="translation-label">Polskie tłumaczenie</div>
                        <div class="translation-value" id="in-val-word">-</div>
                    </div>

                    <div class="input-single-group">
                        <div class="input-label">Angielskie słówko</div>
                        <input type="text" id="input-translation" placeholder="Wpisz po angielsku..." autocomplete="off" autocapitalize="none">
                    </div>

                    <div class="action-buttons-wrapper">
                        <button class="btn-action" id="in-check-btn" onclick="handleInputStep()">Sprawdź</button>
                        <button class="btn-action btn-skip" id="in-skip-btn" onclick="skipInputQuestion()">Pomiń słówko</button>
                        <button class="btn-action btn-end" id="in-end-btn" onclick="showInputSummary()">Zakończ quiz</button>
                        <button class="btn-action btn-next" id="in-next-btn" onclick="loadNextInputQuestion()">Następne słówko</button>
                    </div>

                    <div class="feedback" id="in-feedback"></div>
                </div>
            `;
        }

        function restartInputQuiz() {
            location.reload();
        }

        document.addEventListener("keydown", e => {
            if (e.key === "Enter" && document.getElementById('input-quiz-tab').classList.contains('active')) {
                e.preventDefault();
                handleInputStep();
            }
        });

        // --- QUIZ ABCD ---
        let abcdTotalPool = [...originalWords];
        let abcdAvailableWords = [], abcdCurrentWord = {}, abcdScoreCorrect = 0, abcdScoreTotal = 0, abcdQuestionNumber = 0;
        let abcdSkippedCount = 0;
        let abcdHistory = [];

        function initAbcdQueue(customPool = null) { 
            abcdTotalPool = customPool ? [...customPool] : [...originalWords];
            abcdAvailableWords = [...abcdTotalPool].sort(() => Math.random() - 0.5); 
            abcdQuestionNumber = 0; 
            abcdScoreCorrect = 0;
            abcdScoreTotal = 0;
            abcdSkippedCount = 0;
            abcdHistory = [];
        }

        function loadNextAbcdQuestion() {
            if (!abcdAvailableWords.length) {
                showAbcdSummary();
                return;
            }
            abcdQuestionNumber++;
            abcdCurrentWord = abcdAvailableWords.pop();

            document.getElementById("abcd-feedback").innerHTML = "";
            document.getElementById("abcd-next-btn").style.display = "none";
            document.getElementById("abcd-skip-btn").style.display = "inline-block";
            document.getElementById("abcd-end-btn").style.display = "inline-block";
            document.getElementById("abcd-val-word").innerText = abcdCurrentWord.translation;
            document.getElementById("abcd-counter-text").innerText = `Statystyki: Poprawne ${abcdScoreCorrect} / Wszystkie ${abcdScoreTotal}`;
            document.getElementById("abcd-progress-text").innerText = `Słówko: ${abcdQuestionNumber} / ${abcdTotalPool.length} | Pominięto: ${abcdSkippedCount} / ${abcdTotalPool.length}`;

            const correctAnswerStr = abcdCurrentWord.word;
            let others = originalWords.filter(w => w.word !== abcdCurrentWord.word).sort(() => Math.random() - 0.5);

            let options = [
                { text: correctAnswerStr, isCorrect: true },
                { text: others[0].word, isCorrect: false },
                { text: others[1].word, isCorrect: false }
            ].sort(() => Math.random() - 0.5);

            const container = document.getElementById("abcd-options-container");
            container.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt.text;
                btn.onclick = () => handleAbcdAnswer(btn, opt.isCorrect, correctAnswerStr);
                container.appendChild(btn);
            });
        }

        function handleAbcdAnswer(selectedBtn, isCorrect, correctAnswerStr) {
            abcdScoreTotal++;
            document.querySelectorAll(".option-btn").forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === correctAnswerStr) btn.classList.add("correct-ans");
            });

            abcdHistory.push({
                word: abcdCurrentWord,
                userAnswer: selectedBtn.innerText,
                correctAnswer: correctAnswerStr,
                isCorrect: isCorrect,
                skipped: false
            });

            const feedbackEl = document.getElementById("abcd-feedback");
            if (isCorrect) {
                abcdScoreCorrect++;
                feedbackEl.innerHTML = "<span class='correct'>Dobrze! 🎉</span>";
            } else {
                selectedBtn.classList.add("wrong-ans");
                feedbackEl.innerHTML = `<span class='incorrect'>Źle. Poprawne angielskie słówko to: <strong>${correctAnswerStr}</strong></span>`;
            }

            document.getElementById("abcd-counter-text").innerText = `Statystyki: Poprawne ${abcdScoreCorrect} / Wszystkie ${abcdScoreTotal}`;
            document.getElementById("abcd-skip-btn").style.display = "none";
            document.getElementById("abcd-end-btn").style.display = "none";
            document.getElementById("abcd-next-btn").style.display = "inline-block";
            document.getElementById("abcd-next-btn").focus();
        }

        function skipAbcdQuestion() {
            abcdSkippedCount++;
            const correctAnswerStr = abcdCurrentWord.word;

            document.querySelectorAll(".option-btn").forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === correctAnswerStr) btn.classList.add("correct-ans");
            });

            abcdHistory.push({
                word: abcdCurrentWord,
                userAnswer: "(Pominięto)",
                correctAnswer: correctAnswerStr,
                isCorrect: false,
                skipped: true
            });

            document.getElementById("abcd-feedback").innerHTML = `<span class='skipped-text'>Pominięto słówko. Poprawna odpowiedź została zaznaczona na zielono.</span>`;
            document.getElementById("abcd-skip-btn").style.display = "none";
            document.getElementById("abcd-end-btn").style.display = "none";
            document.getElementById("abcd-next-btn").style.display = "inline-block";
            document.getElementById("abcd-next-btn").focus();
        }

        function showAbcdSummary() {
            const box = document.getElementById("abcd-quiz-box");
            let retryWords = [];

            let listHtml = abcdHistory.map((item, idx) => {
                const w = item.word;
                if (item.skipped || !item.isCorrect) {
                    retryWords.push(w);
                }

                if (item.skipped) {
                    return `
                        <div class="summary-item skipped">
                            <div class="summary-item-content">
                                <div>
                                    <span class="summary-num">${idx + 1}.</span>
                                    <span class="summary-word">${w.translation}</span>
                                    <strong style="color: #888; margin-left: 10px;">[Pominięto]</strong>
                                </div>
                                <div class="summary-details">
                                    <span class="text-skipped">${w.word}</span>
                                </div>
                            </div>
                            <div class="summary-score-badge">0/1</div>
                        </div>
                    `;
                }

                const statusClass = item.isCorrect ? 'perfect' : 'failed';
                let detailsHtml = item.isCorrect 
                    ? `<span class="text-correct">${item.userAnswer}</span>`
                    : `<span class="text-wrong">${item.userAnswer}</span> → <span class="text-correct">${item.correctAnswer}</span>`;

                return `
                    <div class="summary-item ${statusClass}">
                        <div class="summary-item-content">
                            <div>
                                <span class="summary-num">${idx + 1}.</span>
                                <span class="summary-word">${w.translation}</span>
                            </div>
                            <div class="summary-details">${detailsHtml}</div>
                        </div>
                        <div class="summary-score-badge">${item.isCorrect ? '1/1' : '0/1'}</div>
                    </div>
                `;
            }).join('');

            const percent = abcdHistory.length > 0 ? Math.round((abcdScoreCorrect/abcdHistory.length)*100) : 0;
            window.abcdWrongWordsCache = retryWords;

            let retryBtnHtml = retryWords.length > 0 
                ? `<button class="btn-action btn-retry-wrong" onclick="retryAbcdWrongWords()">Powtórz błędne (${retryWords.length})</button>`
                : '';

            box.innerHTML = `
                <a href="#" class="quiz-reset-btn" onclick="restartAbcdQuiz(); return false;" title="Resetuj quiz">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </a>
                <h1>Koniec Quizu! 🎉</h1>
                <div class="summary-score">Twój wynik całkowity: <strong>${abcdScoreCorrect} / ${abcdHistory.length}</strong> (${percent}%)</div>
                <div class="summary-container">
                    <div class="summary-title">Podsumowanie odpowiedzi:</div>
                    <div class="summary-list">${listHtml}</div>
                </div>
            `;

            let oldFooter = document.getElementById("abcd-summary-footer");
            if (oldFooter) oldFooter.remove();

            const footerBar = document.createElement("div");
            footerBar.id = "abcd-summary-footer";
            footerBar.className = "summary-footer-bar";
            footerBar.innerHTML = `
                <button class="btn-action" onclick="restartAbcdQuiz()">Zagraj ponownie</button>
                ${retryBtnHtml}
            `;
            document.getElementById("abcd-quiz-tab").appendChild(footerBar);
        }

        function retryAbcdWrongWords() {
            if (!window.abcdWrongWordsCache || !window.abcdWrongWordsCache.length) return;
            let oldFooter = document.getElementById("abcd-summary-footer");
            if (oldFooter) oldFooter.remove();

            resetAbcdQuizUI();
            initAbcdQueue(window.abcdWrongWordsCache);
            loadNextAbcdQuestion();
        }

        function resetAbcdQuizUI() {
            const tab = document.getElementById("abcd-quiz-tab");
            tab.innerHTML = `
                <div class="quiz-container" id="abcd-quiz-box">
                    <a href="#" class="quiz-reset-btn" onclick="restartAbcdQuiz(); return false;" title="Resetuj quiz">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                            <path d="M3 3v5h5"></path>
                        </svg>
                    </a>
                    <h1>Quiz: Wybierz Angielskie Słówko</h1>
                    <div class="counter" id="abcd-counter-text"></div>
                    <div class="counter" id="abcd-progress-text" style="color: #4CAF50; margin-top: -8px; margin-bottom: 20px; font-weight: 700;"></div>
                    
                    <div class="translation-box">
                        <div class="translation-label">Polskie tłumaczenie</div>
                        <div class="translation-value" id="abcd-val-word">-</div>
                    </div>

                    <div class="options-grid" id="abcd-options-container"></div>

                    <div class="action-buttons-wrapper">
                        <button class="btn-action btn-skip" id="abcd-skip-btn" onclick="skipAbcdQuestion()">Pomiń słówko</button>
                        <button class="btn-action btn-end" id="abcd-end-btn" onclick="showAbcdSummary()">Zakończ quiz</button>
                        <button class="btn-action btn-next" id="abcd-next-btn" onclick="loadNextAbcdQuestion()">Następne słówko</button>
                    </div>

                    <div class="feedback" id="abcd-feedback"></div>
                </div>
            `;
        }

        function restartAbcdQuiz() {
            location.reload();
        }

        window.onload = function() {
            buildTable();
            updateZoomDisplay();
            initPinchZoom();

            initInputQueue();
            loadNextInputQuestion();
            initAbcdQueue();
            loadNextAbcdQuestion();

            switchTab(localStorage.getItem('activeTab') || 'table-tab');
        };
    </script>
</body>
</html>
