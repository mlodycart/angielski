<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czasowniki Nieregularne - Centrum Nauki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html { scrollbar-gutter: stable; overflow-y: scroll; }
        body { background-color: #121212; color: #fff; font-family: 'Space Grotesk', sans-serif; font-weight: 500; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        nav { width: 100%; background-color: #1a1a1a; border-bottom: 2px solid #333; display: flex; justify-content: center; gap: 12px; padding: 16px 10px; }
        .nav-btn { background-color: #2a2a2a; color: #ccc; border: 2px solid #444; padding: 14px 24px; font-family: inherit; font-size: 18px; font-weight: 700; border-radius: 10px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .nav-btn:hover { background-color: #3d3d3d; color: #fff; }
        .nav-btn.active { background-color: #4CAF50; color: #fff; border-color: #4CAF50; }
        .tab-content { display: none; width: 100%; max-width: 1250px; padding: 30px 20px; }
        .tab-content.active { display: block; }
        
        /* PRZYKLEJONY PASEK WYSZUKIWANIA (POSITION: STICKY) */
        .table-header-bar { 
            position: sticky; 
            top: 15px; 
            z-index: 100; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 15px; 
            margin-bottom: 20px; 
            background-color: #1a1a1a; 
            padding: 14px 20px; 
            border-radius: 12px; 
            border: 1px solid #333; 
            flex-wrap: wrap; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        
        .zoom-controls { display: flex; align-items: center; gap: 12px; }
        .zoom-controls span { font-size: 20px; color: #aaa; font-weight: 700; }
        .zoom-btn { background-color: #262626; color: white; border: 2px solid #444; padding: 12px 20px; font-size: 20px; font-weight: 700; border-radius: 10px; cursor: pointer; touch-action: manipulation; line-height: 1; display: inline-flex; align-items: center; justify-content: center; transition: background-color 0.2s, border-color 0.2s; }
        .zoom-btn:hover { border-color: #4CAF50; background-color: #333333; }
        .zoom-btn:active { background-color: #4CAF50; }
        #zoom-level-text { font-size: 20px; color: #4CAF50; min-width: 65px; text-align: center; font-weight: 700; }
        
        .search-box { display: flex; align-items: center; gap: 10px; flex-grow: 1; max-width: 400px; }
        .search-input { width: 100%; padding: 12px 16px; font-family: inherit; font-size: 18px; border: 2px solid #444; border-radius: 10px; background-color: #262626; color: white; outline: none; }
        .search-input:focus { border-color: #4CAF50; }
        
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; touch-action: pan-x pan-y; }
        #table-zoom-wrapper { transform-origin: top left; transition: transform 0.1s ease-out; width: 100%; }
        
        table { width: 100%; border-collapse: collapse; background-color: #1a1a1a; border-radius: 12px; overflow: hidden; font-size: 18px; min-width: 600px; table-layout: fixed; }
        th, td { padding: 18px 20px; text-align: left; border-bottom: 1px solid #2a2a2a; transition: background-color 0.3s, color 0.3s; width: 25%; word-wrap: break-word; }
        th { background-color: #0d0d0d; font-weight: 700; font-size: 20px; border-bottom: 2px solid #444; color: #4CAF50; }
        tr:nth-child(even) { background-color: #242424; }
        .phonetic { color: #aaaaaa; font-size: 0.9em; }
        tr.highlighted-row { background-color: #ffd700 !important; color: #000 !important; font-weight: bold; }
        tr.highlighted-row td { color: #000 !important; }
        tr.highlighted-row .phonetic { color: #333 !important; }
        
        .quiz-container { background-color: #2d2d2d; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); text-align: center; max-width: 1200px; margin: 10px auto; }
        h1 { color: #4CAF50; margin-top: 0; font-size: 38px; font-weight: 700; margin-bottom: 15px; }
        .translation-box { background-color: #3d3d3d; padding: 25px; border-radius: 16px; margin-bottom: 30px; }
        .translation-label { font-size: 16px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.5px; }
        .translation-value { font-size: 46px; font-weight: 700; color: #ff9800; word-break: break-word; }
        .inputs-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 30px; text-align: left; }
        .input-group { background-color: #3d3d3d; padding: 20px; border-radius: 14px; }
        .input-label { font-size: 15px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        
        input[type="text"] { width: 100%; padding: 16px 12px; font-family: inherit; font-weight: 700; font-size: 22px; border: 3px solid #555; border-radius: 10px; background-color: #262626; color: white; text-align: center; box-sizing: border-box; }
        input[type="text"]:focus { border-color: #4CAF50; outline: none; }
        input:disabled { background-color: #262626; color: #888; border-color: #555; opacity: 1; }
        
        .options-grid { display: flex; flex-direction: column; gap: 16px; margin-bottom: 30px; }
        .option-btn { background-color: #3d3d3d; color: white; border: 3px solid #555; padding: 20px 24px; font-family: inherit; font-weight: 700; font-size: 22px; border-radius: 14px; cursor: pointer; transition: all 0.2s; text-align: left; width: 100%; }
        .option-btn:hover:not(:disabled) { background-color: #4d4d4d; border-color: #4CAF50; }
        .option-btn.correct-ans { background-color: #2e7d32 !important; border-color: #4CAF50 !important; }
        .option-btn.wrong-ans { background-color: #c62828 !important; border-color: #f44336 !important; }
        
        .btn-action { background-color: #4CAF50; color: white; border: none; padding: 18px 40px; font-family: inherit; font-weight: 700; font-size: 22px; border-radius: 12px; cursor: pointer; transition: background-color 0.3s; margin: 5px; width: 100%; max-width: 320px; }
        .btn-action:hover { background-color: #45a049; }
        .btn-next { background-color: #2196F3 !important; display: none; }
        .btn-next:hover { background-color: #1976D2 !important; }
        .feedback { margin-top: 25px; font-size: 22px; font-weight: 700; min-height: 40px; line-height: 1.4; }
        .correct { color: #4CAF50; }
        .incorrect { color: #f44336; }
        .counter { font-size: 18px; color: #aaa; margin-bottom: 15px; }

        @media (max-width: 768px) {
            nav { flex-direction: column; padding: 12px 15px; gap: 8px; }
            .nav-btn { width: 100%; font-size: 16px; padding: 12px 16px; }
            .table-header-bar { flex-direction: column; align-items: stretch; top: 10px; }
            .search-box { max-width: 100%; }
            .tab-content { padding: 15px 10px; }
            .quiz-container { padding: 25px 15px; border-radius: 14px; }
            h1 { font-size: 26px; }
            .translation-value { font-size: 34px; }
            .inputs-grid { grid-template-columns: 1fr; gap: 15px; }
            input[type="text"] { font-size: 20px; padding: 14px 10px; }
            .option-btn { font-size: 18px; padding: 16px 18px; }
            .btn-action { font-size: 18px; padding: 16px 20px; max-width: 100%; }
            th, td { padding: 12px 14px; font-size: 16px; }
            th { font-size: 17px; }
        }
    </style>
</head>
<body>

    <nav>
        <button id="btn-table-tab" class="nav-btn" onclick="switchTab('table-tab')">Tabela Słówek</button>
        <button id="btn-input-quiz-tab" class="nav-btn" onclick="switchTab('input-quiz-tab')">Quiz: Wpisywanie</button>
        <button id="btn-abcd-quiz-tab" class="nav-btn" onclick="switchTab('abcd-quiz-tab')">Quiz: Wybór (ABCD)</button>
    </nav>

    <div id="table-tab" class="tab-content">
        <div class="table-header-bar">
            <div class="zoom-controls">
                <span>Rozmiar:</span>
                <button class="zoom-btn" onclick="adjustZoom(-0.1)">-</button>
                <span id="zoom-level-text">100%</span>
                <button class="zoom-btn" onclick="adjustZoom(0.1)">+</button>
                <button class="zoom-btn" onclick="resetZoom()" style="font-size:16px; padding: 12px 16px;">Reset</button>
            </div>
            <div class="search-box">
                <input type="text" id="table-search-input" class="search-input" placeholder="Szukaj..." onkeydown="if(event.key==='Enter') searchTable()" onblur="searchTable()" autocomplete="off">
            </div>
        </div>

        <div class="table-responsive" id="table-container">
            <div id="table-zoom-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Infinitive</th>
                            <th>Past Simple</th>
                            <th>Past Participle</th>
                            <th>Tłumaczenie</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="input-quiz-tab" class="tab-content">
        <div class="quiz-container">
            <h1>Quiz: Wpisz Formy Krok po Kroku</h1>
            <div class="counter" id="in-counter-text"></div>
            <div class="counter" id="in-progress-text" style="color: #4CAF50; margin-top: -8px; margin-bottom: 20px; font-weight: 700;"></div>
            
            <div class="translation-box">
                <div class="translation-label">Tłumaczenie (Polski)</div>
                <div class="translation-value" id="in-val-translation">-</div>
            </div>

            <div class="inputs-grid">
                <div class="input-group">
                    <div class="input-label">Infinitive</div>
                    <input type="text" id="input-0" placeholder="Wpisz..." autocomplete="off" autocapitalize="none">
                </div>
                <div class="input-group">
                    <div class="input-label">Past Simple</div>
                    <input type="text" id="input-1" placeholder="Wpisz..." autocomplete="off" autocapitalize="none" disabled>
                </div>
                <div class="input-group">
                    <div class="input-label">Past Participle</div>
                    <input type="text" id="input-2" placeholder="Wpisz..." autocomplete="off" autocapitalize="none" disabled>
                </div>
            </div>

            <button class="btn-action" id="in-check-btn" onclick="handleInputStep()">Sprawdź</button>
            <button class="btn-action btn-next" id="in-next-btn" onclick="loadNextInputQuestion()">Następne słówko</button>

            <div class="feedback" id="in-feedback"></div>
        </div>
    </div>

    <div id="abcd-quiz-tab" class="tab-content">
        <div class="quiz-container">
            <h1>Quiz: Wybierz Poprawne Formy</h1>
            <div class="counter" id="abcd-counter-text"></div>
            <div class="counter" id="abcd-progress-text" style="color: #4CAF50; margin-top: -8px; margin-bottom: 20px; font-weight: 700;"></div>
            
            <div class="translation-box">
                <div class="translation-label">Tłumaczenie (Polski)</div>
                <div class="translation-value" id="abcd-val-translation">-</div>
            </div>

            <div class="options-grid" id="abcd-options-container"></div>

            <button class="btn-action btn-next" id="abcd-next-btn" onclick="loadNextAbcdQuestion()">Następne słówko</button>

            <div class="feedback" id="abcd-feedback"></div>
        </div>
    </div>

    <script>
        const rawWords = [
            ["oversleep", "overslept", "overslept", "zaspać"],
            ["pay", "paid", "paid", "płacić"],
            ["prove", "proved", "proved / proven", "udowodnić"],
            ["put", "put", "put", "położyć"],
            ["quit", "quit", "quit", "rezygnować, opuszczać"],
            ["read", "read", "read", "czytać"],
            ["rid", "rid", "rid", "pozbyć się"],
            ["ride", "rode", "ridden", "jeździć na"],
            ["ring", "rang", "rung", "dzwonić"],
            ["rise", "rose", "risen", "powstawać, rosnąć"],
            ["run", "ran", "run", "biegać"],
            ["say", "said", "said", "powiedzieć"],
            ["see", "saw", "seen", "zobaczyć"],
            ["seek", "sought", "sought", "szukać"],
            ["sell", "sold", "sold", "sprzedać"],
            ["send", "sent", "sent", "wysłać"],
            ["set", "set", "set", "ustawić"],
            ["sew", "sewed", "sewn / sewed", "szyć"],
            ["shake", "shook", "shaken", "trząść, potrząsać"],
            ["shed", "shed", "shed", "zrzucić, pozbyć się"],
            ["shine", "shone", "shone", "świecić"],
            ["shoot", "shot", "shot", "strzelać"],
            ["show", "showed", "shown", "pokazać"],
            ["shrink", "shrank", "shrunk", "kurczyć się"],
            ["shut", "shut", "shut", "zamknąć"],
            ["sing", "sang", "sung", "śpiewać"],
            ["sink", "sank", "sunk", "tonąć"],
            ["sit", "sat", "sat", "siedzieć"],
            ["sleep", "slept", "slept", "spać"],
            ["slide", "slid", "slid", "zjeżdżać, ślizgać się"],
            ["smell", "smelled / smelt", "smelled / smelt", "pachnieć, wąchać"],
            ["sow", "sowed", "sown / sowed", "siać"],
            ["speak", "spoke", "spoken", "mówić"],
            ["speed", "sped / speeded", "sped / speeded", "przyspieszyć"],
            ["spell", "spelt", "spelt", "przeliterować"],
            ["spend", "spent", "spent", "spędzać"],
            ["spill", "spilled / spilt", "spilled / spilt", "rozlać"],
            ["spin", "spun / span", "spun", "wirować"],
            ["spit", "spat / spit", "spat / spit", "pluć"],
            ["split", "split", "split", "rozdzielić"],
            ["spoil", "spoilt", "spoilt", "zepsuć"],
            ["spread", "spread", "spread", "rozprzestrzenić"],
            ["spring", "sprang", "sprung", "odskakiwać, odbijać"],
            ["stand", "stood", "stood", "stać"],
            ["steal", "stole", "stolen", "ukraść"],
            ["stick", "stuck", "stuck", "wbijać, wtykać, przyklejać"],
            ["sting", "stung", "stung", "ukłuć"],
            ["stink", "stank", "stunk", "śmierdzieć"],
            ["stride", "strode", "strridden", "kroczyć"],
            ["strike", "struck", "struck", "uderzyć, wybić"],
            ["strive", "strove", "striven", "dążyć do czegoś, usiłować"],
            ["swear", "swore", "sworn", "przysięgać"],
            ["sweep", "swept", "swept", "zamiatać"],
            ["swell", "swelled", "swollen / swelled", "puchnąć"],
            ["swim", "swam", "swum", "pływać"],
            ["swing", "swung", "swung", "zakołysać, zamachnąć"],
            ["take", "took", "taken", "wziąć"],
            ["teach", "taught", "taught", "uczyć"],
            ["tear", "tore", "torn", "podrzeć"],
            ["tell", "told", "told", "powiedzieć"],
            ["think", "thought", "thought", "myśleć"],
            ["throw", "threw", "thrown", "rzucać"],
            ["thrust", "thrust", "thrust", "pchnąć"],
            ["tread", "trod", "trodden", "stąpać"],
            ["undergo", "underwent", "undergone", "poddać się czemuś, przejść"],
            ["understand", "understood", "understood", "rozumieć"],
            ["upset", "upset", "upset", "zasmucić"],
            ["wake", "woke", "woken", "obudzić się"],
            ["weave", "wove", "woven", "tkać"],
            ["wear", "wore", "worn", "nosić"],
            ["win", "won", "won", "wygrać"],
            ["wind", "wound", "wound", "nawijać, nakręcić"],
            ["withdraw", "withdrew", "withdrawn", "wycofać się"],
            ["wring", "wrung", "wrung", "wykręcić, wycisnąć"],
            ["write", "wrote", "written", "pisać"]
        ];

        const originalWords = rawWords.map(w => ({
            infinitive: w[0], pastSimple: w[1], pastParticiple: w[2], translation: w[3]
        }));

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content, .nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId)?.classList.add('active');
            document.getElementById("btn-" + tabId)?.classList.add('active');
            localStorage.setItem('activeTab', tabId);
        }

        function buildTable() {
            document.getElementById('table-body').innerHTML = originalWords.map((w, idx) => `
                <tr id="row-word-${idx}">
                    <td>${w.infinitive}</td>
                    <td>${w.pastSimple}</td>
                    <td>${w.pastParticiple}</td>
                    <td>${w.translation}</td>
                </tr>
            `).join('');
        }

        function searchTable() {
            const query = document.getElementById("table-search-input").value.trim().toLowerCase();
            
            document.querySelectorAll("#table-body tr").forEach(tr => tr.classList.remove("highlighted-row"));
            
            if (!query) return;

            let matchingIndexes = [];
            
            originalWords.forEach((w, idx) => {
                const fields = [w.infinitive, w.pastSimple, w.pastParticiple, w.translation];
                
                const isMatch = fields.some(field => {
                    const clean = field.toLowerCase();
                    return clean.startsWith(query) || clean.split(/[\s\/,]+/).some(part => part.startsWith(query));
                });

                if (isMatch) {
                    matchingIndexes.push(idx);
                }
            });

            if (matchingIndexes.length === 1) {
                const foundIdx = matchingIndexes[0];
                const row = document.getElementById(`row-word-${foundIdx}`);
                if (row) {
                    row.classList.add("highlighted-row");
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        let currentZoom = parseFloat(localStorage.getItem('tableZoom')) || 1.0;

        function updateZoomDisplay() {
            const wrapper = document.getElementById('table-zoom-wrapper');
            const zoomText = document.getElementById('zoom-level-text');
            if (wrapper && zoomText) {
                wrapper.style.transform = `scale(${currentZoom})`;
                wrapper.style.width = `${100 / currentZoom}%`;
                zoomText.innerText = `${Math.round(currentZoom * 100)}%`;
                localStorage.setItem('tableZoom', currentZoom);
            }
        }

        function adjustZoom(delta) { currentZoom = Math.min(Math.max(0.4, currentZoom + delta), 1.5); updateZoomDisplay(); }
        function resetZoom() { currentZoom = 1.0; updateZoomDisplay(); }

        let initialDistance = -1;
        function initPinchZoom() {
            const container = document.getElementById('table-container');
            container.addEventListener('touchstart', e => { if (e.touches.length === 2) initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); }, { passive: true });
            container.addEventListener('touchmove', e => {
                if (e.touches.length === 2 && initialDistance > 0) {
                    const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    const diff = (dist - initialDistance) / 200;
                    if (Math.abs(diff) > 0.02) { adjustZoom(diff); initialDistance = dist; }
                }
            }, { passive: true });
            container.addEventListener('touchend', e => { if (e.touches.length < 2) initialDistance = -1; });
        }

        // QUIZ - WPISYWANIE
        let inAvailableWords = [], inCurrentWord = {}, inScoreCorrect = 0, inScoreTotal = 0, inQuestionNumber = 0, inCurrentStep = 0;

        function initInputQueue() { inAvailableWords = [...originalWords].sort(() => Math.random() - 0.5); inQuestionNumber = 0; }

        function loadNextInputQuestion() {
            if (!inAvailableWords.length) initInputQueue();
            inQuestionNumber++;
            inCurrentWord = inAvailableWords.pop();
            inCurrentStep = 0;

            for (let i = 0; i < 3; i++) {
                const inp = document.getElementById("input-" + i);
                inp.value = "";
                inp.disabled = (i !== 0);
                inp.style.borderColor = "#555";
            }

            document.getElementById("in-feedback").innerHTML = "";
            document.getElementById("in-next-btn").style.display = "none";
            document.getElementById("in-check-btn").style.display = "inline-block";
            document.getElementById("in-val-translation").innerText = inCurrentWord.translation;
            document.getElementById("in-counter-text").innerText = `Statystyki: Poprawne ${inScoreCorrect} / Wszystkie ${inScoreTotal}`;
            document.getElementById("in-progress-text").innerText = `Słówko: ${inQuestionNumber} / ${originalWords.length}`;
            document.getElementById("input-0").focus();
        }

        function checkField(userInput, correctAnswer) {
            userInput = userInput.trim().toLowerCase();
            correctAnswer = correctAnswer.toLowerCase();
            return userInput === correctAnswer || (correctAnswer.includes("/") && correctAnswer.split("/").map(s => s.trim()).includes(userInput));
        }

        function handleInputStep() {
            const inputField = document.getElementById("input-" + inCurrentStep);
            const userInput = inputField.value.trim();
            const feedbackEl = document.getElementById("in-feedback");

            if (!userInput) { feedbackEl.innerHTML = "<span class='incorrect'>Musisz coś wpisać!</span>"; return; }

            inScoreTotal++;
            const answers = [inCurrentWord.infinitive, inCurrentWord.pastSimple, inCurrentWord.pastParticiple];
            const isOk = checkField(userInput, answers[inCurrentStep]);

            inputField.disabled = true;
            if (isOk) {
                inScoreCorrect++;
                inputField.style.borderColor = "#4CAF50";
                feedbackEl.innerHTML = "<span class='correct'>Dobrze! 🎉</span>";
            } else {
                inputField.style.borderColor = "#f44336";
                feedbackEl.innerHTML = `<span class='incorrect'>Źle. Poprawna forma to: <strong>${answers[inCurrentStep]}</strong></span>`;
            }

            document.getElementById("in-counter-text").innerText = `Statystyki: Poprawne ${inScoreCorrect} / Wszystkie ${inScoreTotal}`;
            inCurrentStep++;

            if (inCurrentStep < 3) {
                const nextInput = document.getElementById("input-" + inCurrentStep);
                nextInput.disabled = false;
                nextInput.focus();
            } else {
                document.getElementById("in-check-btn").style.display = "none";
                document.getElementById("in-next-btn").style.display = "inline-block";
            }
        }

        document.addEventListener("keydown", e => {
            if (e.key === "Enter" && document.getElementById('input-quiz-tab').classList.contains('active')) {
                if (inCurrentStep < 3) {
                    handleInputStep();
                } else {
                    loadNextInputQuestion();
                }
            }
        });

        // QUIZ - ABCD
        let abcdAvailableWords = [], abcdCurrentWord = {}, abcdScoreCorrect = 0, abcdScoreTotal = 0, abcdQuestionNumber = 0;

        function initAbcdQueue() { abcdAvailableWords = [...originalWords].sort(() => Math.random() - 0.5); abcdQuestionNumber = 0; }
        const formatWordString = w => `${w.infinitive}, ${w.pastSimple}, ${w.pastParticiple}`;

        function loadNextAbcdQuestion() {
            if (!abcdAvailableWords.length) initAbcdQueue();
            abcdQuestionNumber++;
            abcdCurrentWord = abcdAvailableWords.pop();

            document.getElementById("abcd-feedback").innerHTML = "";
            document.getElementById("abcd-next-btn").style.display = "none";
            document.getElementById("abcd-val-translation").innerText = abcdCurrentWord.translation;
            document.getElementById("abcd-counter-text").innerText = `Statystyki: Poprawne ${abcdScoreCorrect} / Wszystkie ${abcdScoreTotal}`;
            document.getElementById("abcd-progress-text").innerText = `Słówko: ${abcdQuestionNumber} / ${originalWords.length}`;

            const correctAnswerStr = formatWordString(abcdCurrentWord);
            let others = originalWords.filter(w => w.infinitive !== abcdCurrentWord.infinitive).sort(() => Math.random() - 0.5);

            let options = [
                { text: correctAnswerStr, isCorrect: true },
                { text: formatWordString(others[0]), isCorrect: false },
                { text: formatWordString(others[1]), isCorrect: false }
            ].sort(() => Math.random() - 0.5);

            const container = document.getElementById("abcd-options-container");
            container.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt.text;
                btn.onclick = () => handleAbcdAnswer(btn, opt.isCorrect, correctAnswerStr);
                container.appendChild(btn);
            });
        }

        function handleAbcdAnswer(selectedBtn, isCorrect, correctAnswerStr) {
            abcdScoreTotal++;
            document.querySelectorAll(".option-btn").forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === correctAnswerStr) btn.classList.add("correct-ans");
            });

            const feedbackEl = document.getElementById("abcd-feedback");
            if (isCorrect) {
                abcdScoreCorrect++;
                feedbackEl.innerHTML = "<span class='correct'>Dobrze! 🎉</span>";
            } else {
                selectedBtn.classList.add("wrong-ans");
                feedbackEl.innerHTML = `<span class='incorrect'>Źle. Poprawna odpowiedź to: <strong>${correctAnswerStr}</strong></span>`;
            }

            document.getElementById("abcd-counter-text").innerText = `Statystyki: Poprawne ${abcdScoreCorrect} / Wszystkie ${abcdScoreTotal}`;
            document.getElementById("abcd-next-btn").style.display = "inline-block";
            document.getElementById("abcd-next-btn").focus();
        }

        window.onload = function() {
            buildTable();
            updateZoomDisplay();
            initPinchZoom();

            initInputQueue();
            loadNextInputQuestion();
            initAbcdQueue();
            loadNextAbcdQuestion();

            switchTab(localStorage.getItem('activeTab') || 'table-tab');
        };
    </script>
</body>
</html>
